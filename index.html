<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI WIKI · 프로젝트 기반 연구 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15232c; --ink2:#4a5a63; --ink3:#7d8b92;
  --paper:#f3f6f5; --sheet:#ffffff; --line:#d9e1df;
  --jade:#1f5a4c; --jade2:#4f8a78; --jade3:#9dbcb2; --jade4:#e3eeea;
  --lacquer:#a2342c; --amber:#b7791f; --amber-bg:#fbf3e3;
  --y24:#9dbcb2; --y25:#4f8a78; --y26:#1f4038;
  --r:6px;
  font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
nav{background:var(--ink);color:#dfe8e5;padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand b{display:block;font-size:22px;letter-spacing:-.02em;color:#fff}
.brand span{font-size:12.5px;color:#9fb3ad;line-height:1.45;display:block;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{all:unset;cursor:pointer;padding:9px 12px;border-radius:var(--r);display:flex;gap:10px;align-items:baseline;font-size:14.5px;color:#cfdcd8}
.menu button small{color:#6f8a83;width:16px;text-align:right;font-size:12px}
.menu button:hover{background:#21333c}
.menu button[aria-current="true"]{background:var(--jade);color:#fff}
.menu button[aria-current="true"] small{color:#bfe0d5}
.menu .sep{height:1px;background:#2a3d46;margin:8px 4px}
.navstat{margin-top:auto;font-size:12.5px;color:#9fb3ad;display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#6f8a83}
.dot.ok{background:#5fc29b}.dot.warn{background:#e0a33a}.dot.off{background:#8a5a55}
main{padding:30px clamp(18px,4vw,48px) 60px;max-width:1180px;width:100%}
h1{font-size:30px;letter-spacing:-.025em;margin:0 0 4px;font-weight:800}
.lead{color:var(--ink2);margin:0 0 24px;max-width:70ch}
h2{font-size:18px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:18px 0 8px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid2>.panel{margin-bottom:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:var(--r);cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--jade2)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.primary:hover{background:#174a3e}
.btn.danger{color:var(--lacquer);border-color:#e3c2bf}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;color:var(--ink2);margin:10px 0 4px;font-weight:600}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:#fff}
textarea{min-height:90px;resize:vertical;line-height:1.55}
.hint{font-size:13px;color:var(--ink3);margin:6px 0 0}
.notice{background:var(--amber-bg);border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin-bottom:18px;font-size:14px}
.notice.ok{background:var(--jade4);border-left-color:var(--jade)}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;background:var(--jade4);color:var(--jade);font-size:12.5px;margin:2px 4px 2px 0}
.tag.warn{background:var(--amber-bg);color:#8a5b14}
.tag.red{background:#f6e3e1;color:var(--lacquer)}
/* hero: three forums */
.forums{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-bottom:18px;overflow:hidden}
.forum{padding:20px 22px;border-right:1px solid var(--line);position:relative}
.forum:last-child{border-right:0}
.forum .yr{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.forum .yr i{width:12px;height:12px;border-radius:3px;display:inline-block}
.forum .where{font-size:13px;color:var(--ink2);min-height:2.6em}
.forum .count{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:10px 0 2px}
.forum .count small{font-size:15px;font-weight:600;color:var(--ink3);letter-spacing:0;margin-left:4px}
.meter{height:6px;background:var(--jade4);border-radius:3px;overflow:hidden;margin-top:10px}
.meter b{display:block;height:100%;background:var(--jade2)}
.forum .fill{font-size:12.5px;color:var(--ink3);margin-top:4px}
.stats{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);margin-bottom:18px}
.stat{flex:1 1 150px;padding:14px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--ink2)}
.chart svg{max-width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);font-weight:600;background:#f8faf9;position:sticky;top:0}
tbody tr:hover{background:#f6f9f8;cursor:pointer}
.tablewrap{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:var(--r)}
.rel{display:inline-block;min-width:26px;text-align:center;border-radius:4px;font-weight:700;font-size:13px;padding:0 6px}
.rel0{background:#eef1f0;color:var(--ink3)}.rel1{background:#eef1f0;color:#5d6b70}.rel2{background:#e3eeea;color:#3c6e60}.rel3{background:#c9ded6;color:#245447}.rel4{background:#7fae9f;color:#fff}.rel5{background:var(--jade);color:#fff}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;padding:6px 0 6px 34px;position:relative;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--jade4);color:var(--jade);font-weight:700;font-size:12.5px;display:grid;place-items:center}
.out{white-space:pre-wrap;background:#fbfcfc;border:1px solid var(--line);border-radius:var(--r);padding:14px;min-height:200px;font-size:14.5px}
dialog{border:0;border-radius:10px;padding:0;width:min(760px,94vw);box-shadow:0 20px 60px rgba(21,35,44,.25)}
dialog::backdrop{background:rgba(21,35,44,.45)}
.dlg{padding:22px 24px;max-height:86vh;overflow:auto}
.dlg .f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);font-size:14px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.progress{font-size:13.5px;color:var(--jade);margin-top:8px}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  nav{position:static;height:auto}
  .menu{flex-direction:row;flex-wrap:wrap}
  .menu .sep{display:none}
  .grid2,.forums,.dlg .f2{grid-template-columns:1fr}
  .forum{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.navlabel{font-size:12px;color:#6f8a83;padding:4px 12px}
.navproj{padding:4px 12px 10px;color:#fff;font-weight:700;font-size:14.5px;line-height:1.4}
.navproj span{display:block;font-size:12px;color:#9fb3ad;font-weight:400;margin-top:2px}
.menu button{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid{display:inline-block;font-size:12px;font-weight:700;color:var(--jade);background:var(--jade4);padding:1px 8px;border-radius:4px;margin-right:6px}
.phead{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--jade);border-radius:var(--r);padding:10px 18px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ph-topic{font-size:14.5px;flex:1 1 320px}
.ph-topic span{color:var(--ink2)}
.ph-kw{flex-basis:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.pcard{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column}
.pcard h3{margin:10px 0 2px;font-size:18px;letter-spacing:-.01em}
.pc-topic{color:var(--ink2);font-size:14px;margin:0 0 8px}
.pc-stats{display:flex;gap:16px;font-size:13.5px;color:var(--ink2);margin-top:auto;padding-top:10px}
.pc-stats b{color:var(--ink);font-size:15px}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;counter-reset:f;padding:0;list-style:none;margin:0}
.flow li{counter-increment:f;background:#f8faf9;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 42px;position:relative;font-size:13px;color:var(--ink2)}
.flow li::before{content:counter(f);position:absolute;left:11px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--jade);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.flow li b{display:block;font-size:14px;color:var(--ink)}
details.panel>summary{cursor:pointer;font-weight:700;font-size:18px}
table.kv th{width:34%;background:none;position:static;color:var(--ink2);font-weight:600}
table.kv td,table.kv th{padding:6px 8px;border-bottom:1px solid var(--line)}
.todo{margin:0;padding-left:20px}.todo li{margin-bottom:8px;font-size:14px}
code{background:#eef3f1;padding:1px 5px;border-radius:3px;font-size:13px}
@media (max-width:880px){.pgrid{grid-template-columns:1fr}.navproj{display:none}main{padding:20px 14px 50px}h1{font-size:24px}.panel>div[style*="repeat(4"]{grid-template-columns:1fr 1fr!important}.stat{flex:1 1 45%}}

.pcard .fill{font-size:12.5px;color:var(--ink3);margin-top:4px}

.srctabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.srctabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;cursor:pointer;font-size:14px}
.srctabs button[aria-selected="true"]{background:var(--jade);border-color:var(--jade);color:#fff}
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.btn.sm{padding:3px 10px;font-size:12.5px;margin-left:4px}
.unk{color:var(--ink3);font-size:12.5px;background:#eef1f0;border-radius:4px;padding:0 6px}
label.radio{display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--ink);margin:4px 0;font-size:14px}
label.radio input{width:auto;margin-top:4px}
.plist{margin:6px 0;padding-left:18px;font-size:14px}.plist li{margin-bottom:4px}
@media (max-width:880px){.kgrid{grid-template-columns:1fr 1fr}.kgrid>div[style]{grid-column:span 2}}

.toolbar .row{gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:0 10px}
.fgrid label{margin-top:4px}
.sep-v{width:1px;height:22px;background:var(--line);margin:0 4px}
.pager{margin-top:10px;gap:10px}
.conf{font-size:11.5px;border-radius:4px;padding:0 6px;font-weight:600}
.conf-high{background:var(--jade4);color:var(--jade)}.conf-mid{background:#eef1e3;color:#6b6a1f}.conf-low{background:#f6e3e1;color:var(--lacquer)}
.st{font-size:12.5px;border-radius:4px;padding:1px 7px;white-space:nowrap}
.st-미분류{background:#eef1f0;color:var(--ink3)}.st-제안{background:var(--amber-bg);color:#8a5b14}.st-승인{background:var(--jade);color:#fff}.st-수정{background:#2e5597;color:#fff}.st-보류{background:#f6e3e1;color:var(--lacquer)}
.tag.ai{background:#fff;border:1px dashed var(--jade2);color:var(--jade)}
.tagbtn{cursor:pointer;font:inherit;font-size:12.5px}
.tag a{color:inherit;text-decoration:none;margin-left:2px}
details.sub{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}details.sub>summary{cursor:pointer;font-weight:700}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fbfcfc}
.dupg{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:10px}
#tb b.t{font-weight:600}
dialog{width:min(980px,96vw)}
@media (max-width:880px){.fgrid{grid-template-columns:1fr 1fr}.fgrid>div[style]{grid-column:span 2}}

.selcount{margin:10px 0 0;font-size:14px}
.topic{border:1px solid var(--line);border-left:4px solid var(--jade2);border-radius:var(--r);padding:14px 16px;margin:12px 0;background:#fff}
.topic p{margin:8px 0}
.ev{display:inline-block;border:1px solid var(--line);background:#f8faf9;border-radius:14px;padding:1px 10px;margin:2px 4px 2px 0;font-size:12.5px;cursor:pointer;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ev:hover{border-color:var(--jade2);background:var(--jade4)}
.ev.gone{cursor:default;color:var(--ink3)}
.evwrap{margin:6px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.align-ok{border-left:4px solid var(--jade)}.align-no{border-left:4px solid var(--lacquer)}.align-q{border-left:4px solid var(--amber)}
table.cmp td{font-size:13px;min-width:110px}
tr.cur td{background:var(--jade4)}
@media (max-width:880px){.grid3{grid-template-columns:1fr}}

.dfield{margin-top:12px}.dfield textarea{margin-top:4px}
.claim{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:8px 0;background:#fff}.claim.sub{margin-left:28px;border-left:3px solid var(--jade3)}
.cst{font-size:12px;border-radius:4px;padding:1px 7px}.cst-검증필요{background:#f6e3e1;color:var(--lacquer)}.cst-근거있음위치미확인{background:var(--amber-bg);color:#8a5b14}.cst-근거확인{background:var(--jade4);color:var(--jade)}.cst-확정{background:var(--jade);color:#fff}
.chbox{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:10px 0;background:#fbfcfc}.chbox .c_title{font-weight:700}

/* ===== 8단계 디자인: 차분한 색, 카드 최소화, 명확한 위계 ===== */
:root{--ink:#1c2a30;--ink2:#46565e;--ink3:#7a878d;--paper:#fafaf8;--sheet:#ffffff;--line:#e3e6e4;--jade:#22594c;--jade2:#4d8576;--jade3:#a4c2b8;--jade4:#eaf2ef;--r:4px}
body{font-size:15px;line-height:1.65;background:var(--paper)}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:16.5px;font-weight:700;margin:0 0 12px}
h3{font-size:14.5px}
.lead{font-size:14.5px;margin-bottom:20px}
/* 왼쪽 메뉴: 밝은 바탕, 그룹 구분 */
.app{grid-template-columns:232px 1fr}
nav{background:#f2f4f3;color:var(--ink);border-right:1px solid var(--line);padding:20px 12px;gap:14px}
.brand b{color:var(--ink);font-size:19px}.brand span{color:var(--ink3);font-size:12px}
.menu{gap:1px}
.menu button{color:var(--ink2);font-size:14px;padding:7px 10px;border-radius:var(--r)}
.menu button:hover{background:#e6ebe9}
.menu button[aria-current="true"]{background:#fff;color:var(--jade);font-weight:600;box-shadow:inset 3px 0 0 var(--jade)}
.menu button.back{color:var(--ink3);font-size:13px}
.navlabel{font-size:11.5px;color:var(--ink3);padding:12px 10px 3px;letter-spacing:.04em}
.navproj{color:var(--ink);padding:8px 10px 2px;font-size:14px}.navproj span{color:var(--ink3)}
.navstat{color:var(--ink2);font-size:12.5px}
.linklike{all:unset;cursor:pointer;color:var(--lacquer);font-weight:600}
#navtoggle{display:none}
/* 본문 구획: 카드 대신 가는 선 */
main{padding:0 clamp(16px,4vw,44px) 60px;max-width:1240px}
.panel{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:20px 0 6px;margin:0 0 10px}
.grid2{gap:28px}.grid2>.panel{padding-top:18px}
details.panel>summary{font-size:15px;padding:2px 0}
.stats{background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;margin:6px 0 16px}
.stat{border-right:0;padding:10px 18px 10px 0}.stat b{font-size:22px;font-weight:700}
.forums{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0}
.forum{padding:14px 18px 12px 0;border-right:1px solid var(--line)}.forum .count{font-size:38px}
.notice{border-left-width:2px;border-radius:0;background:#fbf7ec}
.notice.ok{background:#f1f6f4}
.tag{background:#eef1f0;color:#3f5650;border-radius:3px;font-size:12px}
.btn{border-radius:var(--r);padding:6px 13px;font-size:13.5px;border-color:#d5dad8}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.primary{background:var(--jade);border-color:var(--jade)}
th{background:#f5f6f5;font-weight:600}
tbody tr:nth-child(even){background:#fbfbfa}
tbody tr:hover{background:#f1f5f3}
td,th{padding:8px 9px}
.tablewrap{border-radius:var(--r)}
.toast{transition:none}
dialog{border-radius:6px}
.topic{border:0;border-top:1px solid var(--line);border-left:3px solid var(--jade3);border-radius:0;padding:12px 14px;background:transparent}
.claim,.chbox,.box,.dupg{border-radius:var(--r);background:#fff}
/* 고정 상단 프로젝트 영역 */
.phead{position:sticky;top:0;z-index:20;display:block;background:rgba(250,250,248,.97);border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0 calc(-1*clamp(16px,4vw,44px)) 18px;padding:10px clamp(16px,4vw,44px) 8px}
.ph-main{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;font-size:14.5px}.ph-name{font-weight:700}.ph-sep{color:var(--ink3)}.ph-topic{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch}
.ph-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;font-size:12.5px}
.kw{color:var(--ink3)}.kw+.kw:before{content:"· ";color:#c4cbc8}
.ph-status{margin-left:auto;display:flex;gap:6px}
.chip{display:inline-flex;align-items:center;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:0 8px;background:#fff}
.chip .dot{margin-right:4px}.chip-error{color:var(--lacquer);border-color:#e7c9c5}
.pid{background:#e9efec;color:var(--jade);font-weight:600}
/* 집필 연구 기준 띠 */
.pinned{position:sticky;top:64px;z-index:15;background:#f1f5f3;color:var(--ink);border-left:3px solid var(--jade);border-radius:0;padding:8px 14px;font-size:13px}
.pinned .hint{color:var(--ink3)}
.chlist{top:150px}
/* 상태 센터 */
table.status td{vertical-align:top}table.status tr.st-error td:first-child{color:var(--lacquer);font-weight:600}
.dot.warn{background:#d9a441}.dot{background:#c3cbc8}
/* 첫 화면 */
.hometop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:28px;margin-bottom:6px}
.flowsec{border-top:1px solid var(--line);padding-top:18px;margin:14px 0 22px}
.flowsec h2 .hint{font-weight:400;font-size:13px;margin-left:6px}
.flow7{list-style:none;margin:0;padding:0;display:flex;gap:0;flex-wrap:nowrap;overflow-x:auto}
.flow7 li{flex:1 1 0;min-width:118px;position:relative;padding-right:18px}
.flow7 li:not(:last-child):after{content:"";position:absolute;right:5px;top:50%;width:8px;height:8px;border-top:2px solid var(--jade3);border-right:2px solid var(--jade3);transform:translateY(-50%) rotate(45deg)}
.flow7 button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:10px 10px 9px;min-height:84px}
.flow7 button:hover{border-color:var(--jade2)}
.flow7 button[aria-pressed="true"]{border-color:var(--jade);box-shadow:inset 0 -3px 0 var(--jade)}
.flow7 .fn{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--jade);color:#fff;font-size:11.5px;text-align:center;line-height:20px;margin-bottom:4px}
.flow7 b{display:block;font-size:14px}.flow7 small{display:block;color:var(--ink3);font-size:12px;min-height:1.2em}
.flowinfo{border-left:3px solid var(--jade);background:#fff;padding:10px 16px;margin-top:12px}
.flowinfo h3{margin:4px 0}.flowinfo p{margin:6px 0}
.ptable td{vertical-align:middle}.ptable .pid{margin-right:6px}.meter.sm{width:80px;display:inline-block;margin:0 6px 0 0;vertical-align:middle}
.nowrap{white-space:nowrap}
/* 모바일: 메뉴는 버튼으로 펼치기 */
@media (max-width:880px){
 .app{grid-template-columns:1fr}
 nav{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:8px 14px;gap:8px;overflow:visible}
 .brand b{font-size:16px}.brand span{display:none}
 #navtoggle{display:inline-block;margin-left:auto}
 .menu{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px 12px;flex-direction:column;box-shadow:0 8px 16px rgba(0,0,0,.06);max-height:75vh;overflow:auto}
 nav.open .menu{display:flex}
 .menu button{white-space:normal}
 .navstat{display:none}
 .phead{top:46px;padding-top:8px}.ph-status{margin-left:0}.ph-topic{max-width:100%;white-space:normal}
 .pinned{top:120px}
 main{padding:0 14px 50px}
 .hometop{padding-top:16px}
 .flow7{flex-direction:column;gap:8px}.flow7 li{padding-right:0}.flow7 li:not(:last-child):after{right:auto;left:22px;top:auto;bottom:-9px;transform:rotate(135deg)}
 .flow7 button{min-height:0}
 .stat{flex:1 1 45%}
 .ptable th:nth-child(4),.ptable td:nth-child(4),.ptable th:nth-child(6),.ptable td:nth-child(6){display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== 9단계: 설계안 디자인 ===== */
:root{--ink:#1F2428;--ink2:#4A5157;--ink3:#5C6369;--paper:#F6F6F3;--sheet:#FFFFFF;--line:#E3E4DF;--line2:#ECEDE9;--jade:#1D5C57;--jade2:#3D7A73;--jade3:#9FBDB8;--jade4:#E6EEEC;--amber:#B8641A;--amber-ink:#8A4A12;--r:6px}
html,body{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body{background:var(--paper);color:var(--ink);font-size:15px;line-height:1.6}
.app{grid-template-columns:240px 1fr}
nav{background:#fff;border-right:1px solid var(--line);color:var(--ink);padding:20px 14px}
.brand b{font-size:19px;color:var(--ink)}.brand span{color:var(--ink3)}
.menu{gap:2px}.menu button{color:#3A4146;font-size:14.5px;padding:9px 10px;border-radius:var(--r);box-shadow:none}
.menu button:hover{background:#F1F2EE}.menu button[aria-current="true"]{background:var(--jade4);color:#123E3A;font-weight:600;box-shadow:none}
.menu button.back{margin-top:10px;color:var(--ink3);font-size:13px;border-top:1px solid var(--line2);border-radius:0;padding-top:12px}
.navproj{padding:0 10px 12px;font-weight:700;font-size:14px;line-height:1.4;color:var(--ink)}.navproj span{display:block;font-weight:400;font-size:12px;color:var(--ink3);margin:0 0 2px}
.navlabel{font-size:12px;color:var(--ink3);padding:12px 10px 4px}
.navstat{font-size:12.5px;color:var(--ink2);border-top:1px solid var(--line2);padding-top:12px}.navstat span{display:block;margin-bottom:3px}
main{max-width:none;padding:0 clamp(16px,3vw,40px) 60px}
h1{font-size:26px;letter-spacing:-.02em;margin:28px 0 4px}h2{font-size:16.5px;margin:0 0 12px}
.lead{color:var(--ink2);margin:0 0 22px}
/* 카드는 테두리 있는 흰 면(설계안과 동일), 섹션 선은 없앰 */
.panel,.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 18px}
.panel{border-top:1px solid var(--line)}
.btn{border-radius:var(--r);border:1px solid #C9CCC6;background:#fff;color:var(--ink);padding:7px 14px;font-size:14px}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:600}.btn.primary:hover{background:#174C48}
.btn.big{padding:11px 22px;font-size:15px}.btn.sm{padding:4px 10px;font-size:13px}
.btn.on{background:var(--jade);color:#fff;border-color:var(--jade)}.btn.dec-ok{border-color:var(--jade);color:var(--jade)}
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{border:1px solid #C9CCC6;border-radius:var(--r)}
.tag{background:var(--jade4);color:var(--jade);border-radius:4px;font-size:12.5px}
.notice{background:#FBF5EC;border-left:3px solid var(--amber);border-radius:0 var(--r) var(--r) 0}.notice.ok{background:#EEF5F3;border-left-color:var(--jade)}.notice.err{background:#FBEDEB;border-left-color:#A3352A}
th{background:#F1F2EE;color:var(--ink2)}tbody tr:nth-child(even){background:#FBFBF9}
/* 상단: 맥락 + KCI 검색 */
.phead{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:#fff;border-bottom:1px solid var(--line);margin:0 calc(-1*clamp(16px,3vw,40px)) 0;padding:12px clamp(16px,3vw,40px)}
.tb-ctx{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}.tb-ctx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px}.tb-ctx span{font-size:12.5px;color:var(--ink3)}.tb-ctx em{color:var(--amber-ink);font-style:normal;font-weight:600}
.tb-search{display:flex;align-items:center;gap:8px;flex:2 1 460px}.tb-search label{font-size:13.5px;font-weight:600;color:var(--jade);white-space:nowrap}.tb-search input{flex:1;height:40px;padding:0 12px}.tb-search .btn{height:40px}
/* 대시보드 */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);margin:0 0 18px}
.kpis>div{padding:16px 20px;border-left:1px solid var(--line2)}.kpis>div:first-child{border-left:0}
.kpis span{display:block;font-size:13px;color:var(--ink2)}.kpis b{display:block;font-size:30px;line-height:1.25}.kpis small{font-size:12.5px;color:var(--ink3)}.warnnum{color:var(--amber-ink)}
.dash3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.dash2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}
.vbars{display:flex;align-items:flex-end;gap:12px;height:170px;border-bottom:1px solid #D8DAD4}
.vbars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;padding-bottom:20px}
.vbars span{font-size:13px}.vbars i{display:block;width:100%;background:var(--jade3)}.vbars em{position:absolute;bottom:-22px;font-style:normal;font-size:12px;color:var(--ink2)}
.vbars i.g3{background:#6F9F98}.vbars i.g4{background:var(--jade2)}.vbars i.g5{background:var(--jade)}
.dash3 .vbars+.hint{margin-top:26px}
.hbars{display:flex;flex-direction:column;gap:8px;font-size:13px}.hbars>div{display:grid;grid-template-columns:118px 1fr 34px;gap:8px;align-items:center}
.hbars span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hbars i{display:block;height:12px;background:var(--jade2)}.hbars b{font-weight:600;text-align:right}
.myview{margin:6px 0 8px;padding:8px 12px;background:#FBF5EC;border-left:3px solid var(--amber);font-size:14px}.myview b{color:var(--amber-ink);margin-right:6px}.myview em{color:var(--amber-ink)}
.recent{list-style:none;margin:0;padding:0}.recent li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px}
.linkish{all:unset;cursor:pointer;color:var(--ink)}.linkish:hover{color:var(--jade);text-decoration:underline}
.grade{display:inline-block;min-width:22px;text-align:center;border-radius:4px;color:#fff;font-weight:700;font-size:12.5px;padding:0 6px;background:#B9BDB7;flex:none}
.grade.g3{background:#6F9F98}.grade.g4{background:var(--jade2)}.grade.g5{background:var(--jade)}.grade.g1,.grade.g2{background:#9AA09C}
/* 받은 즉시 분석 */
.intake{background:#fff;border:1px solid var(--jade3);border-radius:var(--r);padding:14px 18px;margin:0 0 18px}
.iklist{list-style:none;margin:10px 0 0;padding:0}.iklist li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;padding:10px 0;border-top:1px solid var(--line2)}
.ik-main{display:flex;gap:10px;flex:1 1 420px;min-width:0}.ik-main b{font-size:14.5px}.ik-main .hint{margin:0;font-size:12.5px}.ik-dec{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dec{font-size:12px;border-radius:4px;padding:1px 7px;margin-right:4px;white-space:nowrap}.dec-미판단{background:#F1F2EE;color:var(--ink3)}.dec-채택{background:var(--jade);color:#fff}.dec-보류{background:#FBF0E1;color:var(--amber-ink)}.dec-제외{background:#EDEEEB;color:#7B8085;text-decoration:line-through}
/* 연구 설정·신규 프로젝트 */
.typecards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.typecards label{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid #D8DAD4;border-radius:var(--r);cursor:pointer;background:#fff;margin:0;font-weight:400;color:var(--ink)}
.typecards label.on{border:2px solid var(--jade);padding:13px 15px}.typecards input{width:auto;margin:0 0 4px}.typecards small{color:var(--ink2);font-size:13px}
.card.view{border-color:var(--amber)}.card.view h2{color:var(--amber-ink)}
.amber{font-weight:400;color:var(--amber-ink);font-size:13px;margin-left:6px}.amberbox{border-color:var(--amber)!important}
.hhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;padding:28px 0 18px;border-bottom:1px solid var(--line);margin-bottom:28px}.hhead h1{margin:0}
.wsteps{list-style:none;padding:0;margin:0 0 22px;display:flex;gap:8px;flex-wrap:wrap}.wsteps li{padding:6px 14px;border-radius:20px;background:var(--jade4);color:var(--jade);font-weight:600;font-size:14px}.wsteps li.on{background:var(--jade);color:#fff}
.stbox{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding:14px 0;border-top:1px solid var(--line2)}.stbox>div:first-child{display:flex;flex-direction:column}.stopts{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
/* 첫 화면 */
.eyebrow{margin:0 0 4px;font-size:13px;color:var(--jade);font-weight:600}.gtitle{font-size:28px;margin:0 0 6px;letter-spacing:-.02em}
.guide{margin-bottom:36px}.flow9{list-style:none;margin:18px 0 8px;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0}
.flow9 li{border-top:3px solid var(--jade);background:#fff}.flow9 li.me{border-top-color:var(--amber)}.flow9 li+li{border-left:1px solid var(--line2)}
.flow9 button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:16px 14px;height:100%;width:100%}
.flow9 button:hover{background:#F7FAF9}.flow9 small{font-size:12px;color:var(--ink3)}.flow9 b{font-size:15.5px}.flow9 span{font-size:13px;color:var(--ink2)}.flow9 em{font-style:normal;font-size:12px;color:var(--jade)}.flow9 li.me em{color:var(--amber-ink)}
.stores{margin-bottom:36px}.stores .card p{margin:6px 0 0;font-size:14px;color:var(--ink2)}
.ptable td{vertical-align:middle;padding:12px 14px}
/* 토픽·참고문헌 */
.tlist{background:#fff;border:1px solid var(--line);border-radius:var(--r)}.tlist label{display:grid;grid-template-columns:28px 1fr 70px;gap:10px;padding:12px 16px;border-top:1px solid var(--line2);margin:0;font-weight:400;color:var(--ink);cursor:pointer}
.tlist label:first-child{border-top:0}.tlist input{width:auto;margin-top:4px}.tlist .hint{display:block;margin:0}.tlist .cnt{text-align:right}
tr.pick td{background:#EEF5F3!important}
.reflist{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 20px 14px 44px;margin:0;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.unsup.trial{border-color:var(--amber);background:#FBF5EC}.trialbtn{border-color:var(--amber);color:var(--amber-ink)}
@media (max-width:1100px){.dash3{grid-template-columns:1fr 1fr}.flow9{grid-template-columns:repeat(4,minmax(0,1fr))}.flow9 li+li{border-left:0}}
@media (max-width:880px){.app{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpis>div:nth-child(3){border-left:0}.dash3,.dash2{grid-template-columns:1fr}.typecards{grid-template-columns:1fr 1fr}.flow9{grid-template-columns:1fr}.topbar{top:46px}.tb-search{flex-wrap:wrap}.tb-search label{flex-basis:100%}}
/* ===== 10단계: 시안과 동일하게 ===== */
.sr{position:absolute;left:-9999px}
/* 대문·신규 프로젝트: 메뉴 없이 전체 폭 + 위쪽 가로 막대 */
body.homemode .app{grid-template-columns:1fr}body.homemode nav{display:none}body.homemode main{padding:0;max-width:none}
.homebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 48px;background:#fff;border-bottom:1px solid #DEDFDA}
.hb-l{display:flex;align-items:baseline;gap:12px}.hb-l span{font-size:13px;color:var(--ink3)}
.logo{all:unset;cursor:pointer;font-size:20px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.homewrap{max-width:1240px;margin:0 auto;padding:40px 48px 64px}.homewrap.narrow{max-width:1000px}

.btn.big{height:44px;padding:0 20px}

.nmeta{font-size:12px;color:var(--ink3);padding:0 10px}.nname{font-size:14px;padding:0 10px 14px;line-height:1.4}
.menu button{padding:9px 10px;font-size:14.5px}
.navstat{margin-top:18px!important;padding:12px 10px 0;border-top:1px solid var(--line2);font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}.navstat span{margin:0}.navstat .bad{color:#A3352A}

/* ===== 12단계(최종): 뉴모피즘 블루 디자인 ===== */
:root{--ink:#0B1640;--ink2:#4C5A85;--ink3:#8590B3;--paper:#EEF2FB;--sheet:#F5F8FE;--line:#DDE4F5;--line2:#E6ECF8;--jade:#2452EC;--jade2:#5B86FF;--jade3:#AFC4FF;--jade4:#E4ECFF;--amber:#6A4DF4;--amber-ink:#4B32C9;--lacquer:#C23A64;--r:22px;
 --navy:linear-gradient(150deg,#3D7BFF 0%,#2452EC 52%,#3A36D6 100%);--raise:9px 9px 22px rgba(150,168,214,.38),-9px -9px 22px rgba(255,255,255,.95);--raise-sm:5px 5px 12px rgba(150,168,214,.38),-5px -5px 12px rgba(255,255,255,.95);--inset:inset 4px 4px 10px rgba(150,168,214,.38),inset -4px -4px 10px rgba(255,255,255,.95);--glow:0 14px 28px rgba(45,92,255,.35)}

.app{position:relative;z-index:1}
h1{color:var(--ink)}.gtitle{color:var(--ink)}

.panel,.card{border-radius:24px}
/* 입력 — 들어가 보이게 */
input[type=text],input[type=search],input[type=number],input[type=password],select,textarea{background:#EDF1FB;border:1px solid rgba(255,255,255,.7);box-shadow:var(--inset);border-radius:14px}

.tb-search,.ksearch input{background:#EDF1FB!important;box-shadow:var(--inset)!important;border:1px solid rgba(255,255,255,.7)!important}
/* 버튼 — 입체 블록 + 반짝임 + 살짝 확대 */
.btn{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.85);background:linear-gradient(145deg,#F8FAFF,#E9EEFA);color:var(--ink);box-shadow:var(--raise-sm);border-radius:14px;font-weight:700;transition:transform .18s ease,box-shadow .18s ease,filter .18s}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-18deg);pointer-events:none;opacity:0}
.btn:hover:not(:disabled){transform:translateY(-2px) scale(1.035)}.btn:hover:not(:disabled)::after{animation:shine .7s ease forwards}
.btn:active:not(:disabled){transform:translateY(0) scale(.99);box-shadow:var(--inset)}
.btn.primary,.btn.on{color:#fff;border:0;background:linear-gradient(180deg,#5B91FF 0%,#2B5DF1 55%,#3240DC 100%);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 8px rgba(20,35,150,.35)}
.btn.primary:hover:not(:disabled){filter:brightness(1.06);box-shadow:0 18px 34px rgba(45,92,255,.42),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.danger{color:var(--lacquer);background:linear-gradient(145deg,#FFF6F9,#F6E6EC)}
.btn.big{border-radius:18px}.btn:disabled{opacity:.5;box-shadow:none}
@keyframes shine{0%{left:-60%;opacity:0}20%{opacity:1}100%{left:130%;opacity:0}}
/* 마우스 올리면 살짝 떠오르며 반짝 */

.kpis>div:hover,.u-card:hover,.flow9 li:hover,.stores .card:hover,.typecards label:hover,.dash3 .card:hover{transform:translateY(-3px) scale(1.015);box-shadow:12px 14px 30px rgba(130,152,214,.45),-10px -10px 24px rgba(255,255,255,1)!important}

/* 문서 유형별 기본값: 분류 기준·집필 구조·출력 설정에 적용 */
const DOC_TYPES={
 "학위논문":{outline:"1장 서론 / 2장 이론적 배경 / 3장 선행연구 검토 / 4장 연구 방법 / 5장 분석 결과 / 6장 논의 / 7장 결론",writeType:"학위논문",depth:"고급",length:20000,cite:"kr",refTarget:80,

 "학술지 논문":{outline:"1. 서론 / 2. 이론적 배경 / 3. 연구 방법 / 4. 분석 결과 / 5. 결론",writeType:"학술논문",depth:"중급",length:8000,cite:"apa",refTarget:40,
   hint:"분량이 제한되므로, 연구 질문에 직접 답하는 문헌만 4~5등급으로 엄격하게 판단한다.",collect:"최근 5~10년 학술지 논문 중심"},
 "연구보고서":{outline:"요약 / 1장 연구 개요 / 2장 현황 분석 / 3장 사례 분석 / 4장 시사점 / 5장 결론 및 제언",writeType:"분석 보고서",depth:"중급",length:12000,cite:"kr",refTarget:30,
   hint:"정책·현황 자료가 중요하므로, 정부·연구기관 보고서와 통계 자료의 관련도를 높게 본다.",collect:"정부·연구기관 보고서, 통계, 언론 자료 포함"},
 "일반 연구자료":{outline:"개요 / 주요 내용 / 분석 / 시사점 / 참고자료",writeType:"연구자료",depth:"초급",length:4000,cite:"apa",refTarget:15,
   hint:"주제 이해에 도움이 되는 자료를 폭넓게 포함한다.",collect:"주제 이해를 돕는 다양한 자료"}
};
const DOC_TYPE_LIST=Object.keys(DOC_TYPES);
const LANGS=["한국어","영어","베트남어","중국어"];
const PROJECT_DEFAULTS={name:"",topic:"",subtitle:"",docType:"학술지 논문",keywords:[],purpose:"",questions:"",view:"",scope:"",target:"",length:"",refCount:"",lang:"한국어",format:"",outline:"",
  vaultName:"",vaultMode:"project",projectDir:"",lastLoad:"",lastSave:"",lastErrors:[],driveInVault:false};
let G={apiKey:"",model:"claude-sonnet-5-5",seq:0};   // 모든 프로젝트 공통 설정
let INDEX=[];                                        // 프로젝트 목록(요약)
let S=null;                                          // 현재 열린 프로젝트
let VAULT=null, VAULT_PENDING=null;                  // 현재 프로젝트의 볼트 폴더
let current="home";
const dt=()=>DOC_TYPES[S.settings.docType]||DOC_TYPES["학술지 논문"];

/* ---------- 유틸 ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>new Date().toISOString();
const fmtTime=t=>t?new Date(t).toLocaleString("ko-KR",{dateStyle:"short",timeStyle:"short"}):"없음";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3400);}
function safeName(s){return String(s||"무제").replace(/[\\/:*?"<>|#^\[\]]/g,"").replace(/\s+/g," ").trim().slice(0,70)||"무제";}
function download(name,text,type="text/plain"){const b=new Blob([text],{type:type+";charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const papers=()=>S.items.filter(i=>i.kind==="paper");
const mous=()=>S.items.filter(i=>i.kind==="mou");
const splitKw=v=>String(v||"").split(/[,，]/).map(x=>x.trim()).filter(Boolean);

/* ---------- IndexedDB ---------- */
let DBP=null;
function db(){return DBP||(DBP=new Promise((res,rej)=>{const r=indexedDB.open("aiwiki-db",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("h"))d.createObjectStore("h");if(!d.objectStoreNames.contains("data"))d.createObjectStore("data");};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error("다른 탭에서 AI WIKI가 열려 있어 저장소를 업그레이드하지 못했습니다. 다른 탭을 닫고 새로고침하세요."));}));}
async function dbPut(store,k,v){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function dbGet(store,k){const d=await db();return new Promise((res,rej)=>{const q=d.transaction(store).objectStore(store).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbDel(store,k){const d=await db();return new Promise((res,rej)=>{const tx=d.transaction(store,"readwrite");tx.objectStore(store).delete(k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}

/* ---------- 저장 ---------- */
function stats(p){const it=p.items||[];const lit=it.filter(i=>i.kind==="paper").length;const data=it.filter(i=>i.kind==="mou").length;const tg=it.filter(i=>i.kind==="paper"||i.kind==="mou");const done=tg.filter(i=>i.kind==="mou"?!!i.sector:!!i.relevance).length;return{lit,data,total:it.length,cls:tg.length,done,drafts:(p.drafts||[]).length};}
function upsertIndex(p){const s=p.settings;const e={id:p.id,name:s.name,topic:s.topic,docType:s.docType,keywords:s.keywords,created:p.created,lastOpened:p.lastOpened,updated:p.updated,vaultName:s.vaultName,stats:stats(p)};const i=INDEX.findIndex(x=>x.id===p.id);if(i<0)INDEX.push(e);else INDEX[i]=e;}
let saveTimer=null;
function save(){renderNavStat();clearTimeout(saveTimer);saveTimer=setTimeout(flush,250);}

/* ---------- YAML 속성(frontmatter) ---------- */
function parseFM(text){
  text=text.replace(/^\uFEFF/,"");
  if(!text.startsWith("---")) return {fm:{},body:text};
  const end=text.indexOf("\n---",3); if(end<0) return {fm:{},body:text};
  const lines=text.slice(3,end).split(/\r?\n/); const fm={}; let lastKey=null;
  for(const ln of lines){
    if(!ln.trim()) continue;
    const li=ln.match(/^\s+-\s+(.*)$/);
    if(li&&lastKey){ if(!Array.isArray(fm[lastKey])) fm[lastKey]=[]; fm[lastKey].push(unq(li[1])); continue; }
    const m=ln.match(/^([A-Za-z0-9_\-가-힣]+):\s*(.*)$/); if(!m) continue;
    lastKey=m[1]; let v=m[2].trim();
    if(v.startsWith("[")&&v.endsWith("]")){ fm[lastKey]=v.slice(1,-1).split(",").map(x=>unq(x.trim())).filter(Boolean); }
    else fm[lastKey]=v===""?"":unq(v);
  }
  return {fm,body:text.slice(end+4).replace(/^\r?\n/,"")};
}
function unq(v){v=String(v).trim(); if((v.startsWith('"')&&v.endsWith('"'))||(v.startsWith("'")&&v.endsWith("'"))){try{return v.startsWith('"')?JSON.parse(v):v.slice(1,-1);}catch(e){return v.slice(1,-1);}} return v;}
function toFM(obj){
  const out=["---"];
  for(const [k,v] of Object.entries(obj)){
    if(v===undefined||v===null||v==="") continue;
    if(Array.isArray(v)){ if(!v.length) continue; out.push(k+": ["+v.map(x=>JSON.stringify(String(x))).join(", ")+"]"); }
    else if(typeof v==="number") out.push(k+": "+v);
    else out.push(k+": "+JSON.stringify(String(v)));
  }
  out.push("---"); return out.join("\n");
}

const SECTOR_RULES={
 "에너지·원전":["원전","원자력","에너지","lng","전력","태양광","수소","암모니아","재생","케이블","그리드","statcom","발전","연료","petro","evn"],

 "반도체·첨단제조":["반도체","이차전지","음극재","배터리","소재","부품","전자","스마트팩토리","스마트 팩토리","철강","칩"],

 "조선·항공·물류":["조선","선박","항공","물류","항만","해운","정비"],
 "금융":["금융","은행","결제","bank","보험","증권"],
 "관광·문화":["관광","문화","콘텐츠","투어","vinpearl"],
 "교육·인력양성":["교육","인력","학위","연수","양성","인턴","2+2"],
 "농식품":["농산물","농업","식품","과일","저온","k-food"],
 "소비재·유통":["유통","소비재","매매","욕실","신발","포장재","라이프스타일","화장품"],
 "바이오·의료":["바이오","의료","헬스","제약","요양","재활","생명공학"],
 "지역개발":["녹색 성장","하이테크파크","산업단지","지역 개발","도시개발"]
};
function ruleSector(t){t=t.toLowerCase();if(/학위|복수학위|이중 학사|공동 석사|강사 연수|2\+2|인턴십|인력 양성|인력양성/.test(t))return"교육·인력양성";let best=null,bs=0;for(const [s,ks] of Object.entries(SECTOR_RULES)){const n=ks.reduce((a,k)=>a+(t.includes(k)?1:0),0);if(n>bs){bs=n;best=s;}}return best||"기타";}
const BIG=["sk","삼성","lg","현대","hd현대","포스코","효성","롯데","한화","gs","두산","kt","대한항공","하나은행","하나투어","신한","대우건설","대한전선","cj","ls","기업은행","우리은행","국민은행","nh농협"];
function ruleKr(t){const l=t.toLowerCase();if(/대학|공대|university/.test(l))return"대학";if(/상공회의소|협회|연합회|중앙회/.test(l))return"경제단체";if(/공사|공단|koica|한국전력|진흥원|^sr$|kepco|연구원|kist|kind|kamco/.test(l))return"공공기관";if(/의료재단|병원/.test(l))return"기타(의료법인)";if(BIG.some(b=>l.startsWith(b)||l.includes(b+" ")||l.includes(b+"그룹")||l.includes(b+"이노")))return"대기업";return"중소·중견기업";}
function ruleVn(t){const l=t.toLowerCase();if(!t||/미기재|미상/.test(t))return"미상";if(/대학|university|ptit/.test(l))return"대학";if(/상공회의소|협회|vcci/.test(l))return"경제단체";if(/bank|은행/.test(l)&&!/bidv|agribank/.test(l))return"금융기관";if(/evn|전력공사|전력그룹|petro|pvn|viettel|vnpt|우정통신|bidv|agribank|아그리뱅크|국영|철도운송|러버|사이공투어리스트|saigontourist|vimc|베트남항공|ptsc|자산관리공사/.test(l))return"국영기업";if(/국가혁신센터|nic|교육훈련부|교육부|재정부|투자촉진센터|정부$/.test(l))return"정부기관";if(/성$|시$|성 |인민위원회|보건국/.test(t))return"지방정부";return"민간기업";}
function ruleCoop(t){if(/합작/.test(t))return"합작법인";if(/교육|인력|학위|연수|양성|인턴/.test(t))return"인력양성";if(/금융|결제|은행 서비스|사업비 조달/.test(t))return"금융";if(/구매|수출|교역|매매|공급|유통/.test(t))return"교역·구매";if(/투자|공장|증액|건설|건립|계획 수립|토지/.test(t))return"투자";if(/공동|개발|구축|조성/.test(t))return"공동개발";if(/기술|솔루션|장비/.test(t))return"기술협력";return"교류협력";}
/* 논문 관련도: 프로젝트의 키워드·연구 주제 기준(주제와 무관하게 동작) */
const STOP=new Set(["연구","분석","중심으로","대한","관한","통한","위한","및","의","에","간","the","of","and","in","a","on","for","with","study","analysis"]);
function relTerms(){const s=S.settings;
  const phrases=(s.keywords||[]).map(k=>k.toLowerCase().replace(/\(([^)]*)\)/g," $1 ").replace(/\s+/g," ").trim()).filter(Boolean);
  const words=[...new Set(phrases.flatMap(p=>p.split(/[\s·,\-\/]+/)).concat(String(s.topic||"").toLowerCase().split(/[\s·,\-\/:()~]+/)).filter(w=>w.length>=2&&!STOP.has(w)&&!/^\d+년?$/.test(w)))];
  return {phrases,words};}
function ruleRelevance(it){
  const title=(it.title||"").toLowerCase(); const rest=((it.keywords||[]).join(" ")+" "+(it.abstract||"")+" "+(it.summary||"")).toLowerCase();
  const {phrases,words}=relTerms();
  const pt=phrases.filter(p=>title.includes(p)),pr=phrases.filter(p=>!title.includes(p)&&rest.includes(p));
  const wt=words.filter(w=>title.includes(w)),wr=words.filter(w=>!title.includes(w)&&rest.includes(w));
  const score=pt.length*2+pr.length+wt.length*0.75+wr.length*0.35;
  const r=score>=4?5:score>=2.5?4:score>=1.25?3:score>=0.5?2:1;
  const hits=[...new Set([...pt,...pr,...wt,...wr])];
  return {relevance:r,reason:hits.length?"일치 용어: "+hits.slice(0,8).join(", "):"연구 키워드와 일치하는 용어 없음"};
}
function classifyRule(it,force){
  if(it.kind==="mou"){
    const txt=[it.content,it.title,it.korea_party,it.vietnam_party].join(" ");
    if(force||!it.sector) it.sector=/상공회의소/.test(it.korea_party||"")&&!/인력/.test(it.korea_party||"")?"종합(경제단체)":ruleSector(txt);
    if(force||!it.korea_type) it.korea_type=ruleKr(it.korea_party||"");
    if(force||!it.vietnam_type) it.vietnam_type=ruleVn(it.vietnam_party||"");
    if(force||!it.coop_type) it.coop_type=ruleCoop(it.content||"");
    it.relevance=5; it.relevance_reason="분석 대상 데이터"; it.cls_by="규칙";
  } else if(it.kind==="paper"||it.kind==="note"){
    const r=ruleRelevance(it); it.relevance=r.relevance; it.relevance_reason=r.reason; it.cls_by="규칙";
  }
  it.updated=now();
}

/* ---------- Claude API ---------- */
async function callClaude(prompt,maxTokens=4000){
  if(!G.apiKey) throw new Error("API 키가 없습니다. 연동 설정에서 Claude API 키를 입력하세요.");
  let r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":G.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:G.model,max_tokens:maxTokens,messages:[{role:"user",content:prompt}]})});}catch(e){G.apiVerified=false;G.apiError="네트워크 오류: Claude API에 연결하지 못했습니다";throw new Error(G.apiError);}
  const d=await r.json().catch(()=>({}));
  if(!r.ok){G.apiVerified=false;G.apiError=(d.error&&d.error.message)||("API 오류 "+r.status);throw new Error(G.apiError);}
  G.apiVerified=true;G.apiError="";
  return (d.content||[]).map(c=>c.type==="text"?c.text:"").join("\n");
}
function parseJSON(t){t=t.replace(/```json|```/g,"").trim();const a=t.indexOf("["),o=t.indexOf("{");const s=(a>=0&&(a<o||o<0))?a:o;return JSON.parse(t.slice(s,t.lastIndexOf(s===a?"]":"}")+1));}
function projectContext(){const s=S.settings;return `[프로젝트 ${S.id}]\n문서 유형: ${s.docType} — ${dt().hint}\n연구 주제: ${s.topic}${s.subtitle?" — "+s.subtitle:""}\n연구 목적: ${s.purpose||"(미입력)"}\n핵심 키워드: ${(s.keywords||[]).join(", ")}\n연구 질문:\n${s.questions||"(미정)"}\n관점·가설: ${s.view||"(없음)"}\n분석 대상·제외 범위: ${s.scope||"(없음)"}\n작성 언어: ${s.lang}`;}
async function classifyAI(batch){
  const items=batch.map((it,i)=>it.kind==="mou"?{i,kind:"mou",korea:it.korea_party,vietnam:it.vietnam_party,content:it.content}:{i,kind:"paper",title:it.title,year:it.year,journal:it.journal,keywords:(it.keywords||[]).join(", "),abstract:(it.abstract||it.summary||"").slice(0,900)});
  const prompt=`${projectContext()}\n\n아래 자료를 분류하세요. 제외 범위에 해당하면 1~2등급으로 매기세요. 반드시 JSON 배열만 출력하세요.\n- mou: {"i":번호,"sector":${JSON.stringify(SECTORS)} 중 하나,"korea_type":${JSON.stringify(KR_TYPES)} 중 하나,"vietnam_type":${JSON.stringify(VN_TYPES)} 중 하나,"coop_type":${JSON.stringify(COOP_TYPES)} 중 하나}\n- paper: {"i":번호,"relevance":1~5 정수(5=핵심 근거, 1=거의 무관),"reason":"이 프로젝트와의 접점 한 문장","summary":"두 문장 요약","keywords":["핵심어",...최대5]}\n\n자료:\n${JSON.stringify(items)}`;
  const res=parseJSON(await callClaude(prompt,3500));
  for(const r of res){const it=batch[r.i]; if(!it) continue;
    if(it.kind==="mou"){ if(SECTORS.includes(r.sector))it.sector=r.sector; if(KR_TYPES.includes(r.korea_type))it.korea_type=r.korea_type; if(VN_TYPES.includes(r.vietnam_type))it.vietnam_type=r.vietnam_type; if(COOP_TYPES.includes(r.coop_type))it.coop_type=r.coop_type; it.relevance=5; it.relevance_reason="분석 대상 데이터"; }
    else { const v=parseInt(r.relevance); if(v>=1&&v<=5) it.relevance=v; if(r.reason) it.relevance_reason=r.reason; if(r.summary) it.summary=r.summary; if(Array.isArray(r.keywords)&&!(it.keywords||[]).length) it.keywords=r.keywords; }
    it.cls_by="AI"; it.updated=now();
  }
}

function vpath(){const s=S.settings,legacy=s.vaultMode==="all",dir=s.projectDir;
  return {legacy,dir,lit:legacy?"3-Resources/논문":dir+"/문헌",data:legacy?"3-Resources/MOU":dir+"/데이터/MOU",analysis:legacy?"AI-WIKI/분석":dir+"/분석",

function inScope(p,fm){const x=vpath();
  if(x.legacy) return !/^1-Projects\/PRJ-\d+_/.test(p);           // 다른 프로젝트 폴더는 제외
  if(p.startsWith(x.analysis+"/")) return false;
  if(p.startsWith(x.dir+"/")) return true;
  return [].concat(fm.project_ids||[]).includes(S.id);             // 연구자가 명시적으로 연결한 노트
}
async function vaultPermission(ask){if(!VAULT)return false;const opt={mode:"readwrite"};if((await VAULT.queryPermission(opt))==="granted")return true;if(ask&&(await VAULT.requestPermission(opt))==="granted")return true;return false;}
async function connectVault(){
  if(!FS_OK){toast("이 브라우저는 폴더 연결을 지원하지 않습니다. Chrome 또는 Edge에서 여세요.");return;}
  try{VAULT=await window.showDirectoryPicker({mode:"readwrite",id:("aiwiki-"+S.id).toLowerCase()});VAULT_PENDING=null;
    await dbPut("h","vault:"+S.id,VAULT);S.settings.vaultName=VAULT.name;save();toast(`"${VAULT.name}" 폴더를 ${S.id}에 연결했습니다.`);render();}
  catch(e){if(e.name!=="AbortError")toast("연결하지 못했습니다: "+e.message);}

async function* walk(dir,path=""){for await (const [name,h] of dir.entries()){if(name.startsWith("."))continue;const p=path?path+"/"+name:name;if(h.kind==="directory"){if(p==="AI-WIKI")continue;yield* walk(h,p);}else if(name.toLowerCase().endsWith(".md"))yield [p,h];}}
async function getDir(root,parts,create){let d=root;for(const p of parts){if(p)d=await d.getDirectoryHandle(p,{create});}return d;}
async function writeText(root,path,text){const parts=path.split("/");const name=parts.pop();const d=await getDir(root,parts,true);const fh=await d.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(text);await w.close();}

  it.tags=[...new Set([].concat(fm.tags||[]).concat((body.match(/(^|\s)#([^\s#\[\]]+)/g)||[]).map(x=>x.trim().slice(1))))];

async function saveToVault(){

  if(!(await vaultPermission(true))){toast("폴더 쓰기 권한이 필요합니다. 브라우저 창에서 허용을 눌러 주세요.");return;}
  const prog=$("#vprog");let w=0;const errors=[];const x=vpath();
  try{await writeText(VAULT,x.info,projectInfoNote());w++;}catch(e){errors.push("프로젝트 정보: "+e.message);}

    if(!["paper","mou"].includes(it.kind))continue;
    try{
      if(it.origin!=="vault"){
        const path=it.kind==="paper"?`${x.lit}/${safeName(it.title)}.md`:`${x.data}/${it.year||"연도미상"}/${safeName((it.mou_id?it.mou_id+"_":"")+it.korea_party+"-"+it.vietnam_party)}.md`;
        await writeText(VAULT,path,noteForItem(it));it.origin="vault";it.path=path;it.mtime=Date.now();w++;
      }

      if(prog&&w%10===0)prog.textContent=`저장 중… ${w}개`;

  try{await writeText(VAULT,x.summary,summaryMarkdown());w++;}catch(e){errors.push("대시보드 요약: "+e.message);}
  S.settings.lastSave=now();S.settings.lastErrors=errors;save();
  toast(errors.length?`${w}개 저장, ${errors.length}개 오류. 오류 내용은 연동 설정에서 확인하세요.`:`${w}개 파일을 볼트에 저장했습니다.`);
  render();
}

function countBy(list,f){const m={};for(const x of list){const k=f(x)||"미분류";m[k]=(m[k]||0)+1;}return m;}
function summaryMarkdown(){
  const M=mous(),P=papers(),s=S.settings;
  let out=`---\ntitle: "AI WIKI 대시보드 요약"\ntype: analysis\nproject_id: "${S.id}"\nupdated: "${now()}"\n---\n\n# 대시보드 요약 — ${s.name}\n\n- 프로젝트: ${S.id} · ${s.docType}\n- 연구 주제: ${s.topic}\n- 전체 자료 ${S.items.length}개 (논문 ${P.length}, 분석 데이터 ${M.length})\n`;
  if(M.length){
    out+=`\n## 연도별 MOU 입력 현황\n\n| 연도 | 체결 | 입력 |\n| --- | --- | --- |\n`;
    for(const y of [2024,2025,2026]) out+=`| ${y} | ${FORUMS[y].total} | ${M.filter(m=>+m.year===y).length} |\n`;
    out+=`\n## 산업 분야 × 연도\n\n| 분야 | 2024 | 2025 | 2026 |\n| --- | --- | --- | --- |\n`;
    for(const sec of SECTORS){const c=[2024,2025,2026].map(y=>M.filter(m=>+m.year===y&&m.sector===sec).length);if(c.some(Boolean))out+=`| ${sec} | ${c.join(" | ")} |\n`;}
  }
  out+=`\n## 논문 관련도 분포\n\n| 등급 | 편수 |\n| --- | --- |\n`;
  for(const r of [5,4,3,2,1]) out+=`| ${r}등급 | ${P.filter(p=>p.relevance===r).length} |\n`;
  return out;
}

function hbars(data,color="var(--jade2)"){
  const rows=data.filter(d=>d.value>0); if(!rows.length) return `<p class="hint">아직 표시할 자료가 없습니다.</p>`;
  const max=Math.max(...rows.map(d=>d.value)),h=26,W=460,L=128;
  return `<svg width="${W}" viewBox="0 0 ${W} ${rows.length*h+4}" role="img">${rows.map((d,i)=>{const w=Math.max(2,(W-L-40)*d.value/max);return `<text x="${L-8}" y="${i*h+17}" text-anchor="end" font-size="12.5" fill="var(--ink2)">${esc(d.label)}</text><rect x="${L}" y="${i*h+6}" width="${w}" height="14" rx="2" fill="${d.color||color}"/><text x="${L+w+6}" y="${i*h+17}" font-size="12.5" fill="var(--ink)" font-weight="600">${d.value}</text>`;}).join("")}</svg>`;
}
function groupedYears(cats,getVal,W=400){
  const ys=[2024,2025,2026]; const rows=cats.filter(c=>ys.some(y=>getVal(c,y)>0)); if(!rows.length) return `<p class="hint">데이터를 분류하면 여기에 연도별 비교가 나타납니다.</p>`;
  const max=Math.max(1,...rows.flatMap(c=>ys.map(y=>getVal(c,y)))); const bh=9,gap=14,gh=ys.length*bh+gap,L=128;
  return `<svg width="${W}" viewBox="0 0 ${W} ${rows.length*gh}" role="img">${rows.map((c,i)=>`<text x="${L-8}" y="${i*gh+16}" text-anchor="end" font-size="12.5" fill="var(--ink2)">${esc(c)}</text>`+ys.map((y,j)=>{const v=getVal(c,y),w=v?Math.max(2,(W-L-30)*v/max):0;return `<rect x="${L}" y="${i*gh+3+j*bh}" width="${w}" height="${bh-1}" fill="${YC[y]}"><title>${y}년 ${v}건</title></rect>${v?`<text x="${L+w+4}" y="${i*gh+3+j*bh+7}" font-size="10" fill="var(--ink2)">${v}</text>`:""}`;}).join("")).join("")}</svg>`;
}

const COLMAP={title:["제목","논문명","논문제목","논문 제목","title","자료명","서명"],authors:["저자","저자명","author","authors","저자사항"],year:["발행연도","발행년도","연도","출판연도","year","발행년"],journal:["학술지명","학술지","학술지/학위수여기관","간행물명","저널명","journal","출판사","발행기관"],volume:["권호","권호사항","권호·쪽수","권/호","volume"],doi:["doi"],keywords:["주제어","키워드","핵심 키워드","keywords","keyword"],abstract:["초록","국문초록","abstract","요약","초록 기반 요약(자체 요약)"],url:["url","링크","원문url","주소","서지 확인 링크"],

function mapRow(row){const keys=Object.keys(row);const norm=k=>String(k).toLowerCase().replace(/\s/g,"");const o={};for(const [f,al] of Object.entries(COLMAP)){const k=keys.find(k=>al.some(a=>norm(k)===norm(a)))||keys.find(k=>al.some(a=>norm(k).includes(norm(a))&&norm(a).length>1));if(k!==undefined&&row[k]!==undefined&&String(row[k]).trim()!=="")o[f]=String(row[k]).trim();}return o;}
async function readFile(f){
  if(f.name.toLowerCase().endsWith(".csv")){const t=await f.text();return csvParse(t.replace(/^\uFEFF/,""));}
  if(typeof XLSX==="undefined") throw new Error("엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 CSV로 저장해 올리세요.");
  const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
  const sh=wb.Sheets[wb.SheetNames[0]];const aoa=XLSX.utils.sheet_to_json(sh,{header:1,defval:""});
  let hi=aoa.findIndex(r=>r.some(c=>/제목|논문명|title|mou_id|korea_party/i.test(String(c))));if(hi<0)hi=0;
  const head=aoa[hi].map(String);return aoa.slice(hi+1).filter(r=>r.some(c=>String(c).trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]])));
}
function csvParse(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}else if(ch==='"')q=true;else if(ch===","){r.push(c);c="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c="";}else c+=ch;}if(c||r.length){r.push(c);rows.push(r);}const h=rows.shift()||[];return rows.filter(x=>x.some(v=>v.trim())).map(x=>Object.fromEntries(h.map((k,i)=>[k.trim(),x[i]??""])));}

const normT=t=>String(t||"").toLowerCase().replace(/<[^>]+>/g,"").replace(/[^0-9a-z가-힣ㄱ-ㅎ]/g,"");
const normDoi=d=>String(d||"").toLowerCase().replace(/^https?:\/\/(dx\.)?doi\.org\//,"").trim();
function findDup(c,exceptId){
  const d=normDoi(c.doi),k=c.kci_id,t=normT(c.title),y=parseInt(c.year)||0;
  for(const it of S.items){
    if(it.kind!=="paper"||it.id===exceptId)continue;
    if(d&&normDoi(it.doi)===d)return {item:it,by:"DOI"};
    if(k&&it.kci_id===k)return {item:it,by:"KCI ID"};
    if(t&&t.length>=6&&normT(it.title)===t&&(!y||!it.year||parseInt(it.year)===y))return {item:it,by:"제목·연도"};
  }
  return null;
}

const ON_HTTP=/^https?:$/.test(location.protocol);
async function api(path,opt={}){
  if(!ON_HTTP)throw Object.assign(new Error("앱을 로컬 연동 서버 주소(http://localhost:8765)로 열어야 합니다."),{kind:"noserver"});
  let r;try{r=await fetch(path,Object.assign({headers:{"X-AIWIKI":"1","Content-Type":"application/json"}},opt));}
  catch(e){throw Object.assign(new Error("로컬 연동 서버에 연결하지 못했습니다. 서버 창이 켜져 있는지 확인하세요."),{kind:"noserver"});}
  const d=await r.json().catch(()=>({ok:false,error:"서버 응답을 읽지 못했습니다 (HTTP "+r.status+")"}));
  if(!d.ok)throw Object.assign(new Error(d.error||"요청 실패"),{kind:d.kind||"error"});
  return d;
}

async function scanVault(){
  if(!VAULT)throw new Error("먼저 볼트 폴더를 연결하세요.");
  if(!(await vaultPermission(true)))throw new Error("폴더 읽기 권한이 필요합니다. 브라우저 창에서 허용을 눌러 주세요.");
  const plan={add:[],upd:[],link:[],same:0,out:0,skip:0,errors:[],total:0};
  const byPath=new Map(S.items.filter(i=>i.path&&i.origin==="vault").map(i=>[i.path,i]));
  const prog=$("#vprog")||$("#ob_prog");
  for await (const [p,h] of walk(VAULT)){
    try{const f=await h.getFile();plan.total++;if(prog)prog.textContent=`확인 중… ${plan.total}개`;
      const ex=byPath.get(p);if(ex&&ex.mtime>=f.lastModified){plan.same++;continue;}

      const it=itemFromNote(p,fm,body,f.lastModified);if(!it){plan.skip++;continue;}
      if(ex){plan.upd.push({ex,it});continue;}
      if(it.kind==="paper"){const d=findDup(it);if(d&&d.item.origin!=="vault"){plan.link.push({ex:d.item,it,by:d.by});continue;}if(d){plan.skip++;continue;}}

async function applyScan(plan){

  for(const {ex,it} of plan.link){fillEmpty(ex,it);ex.path=it.path;ex.mtime=it.mtime;ex.origin="vault";ex.tags=it.tags;ex.links=it.links;}
  try{const ad=await getDir(VAULT,vpath().analysis.split("/"),false);
    for await (const [name,h] of ad.entries()){if(h.kind!=="file"||!name.endsWith(".md"))continue;const {fm,body}=parseFM(await (await h.getFile()).text());
      if(fm.project_id&&fm.project_id!==S.id)continue;const it=S.items.find(x=>x.path===fm.source_path);if(!it)continue;
      const v=sectionOf(body,"내 관점");if(v&&!/^\(/.test(v))it.my_view=v;if(fm.relevance&&it.kind!=="mou")it.relevance=parseInt(fm.relevance)||it.relevance;
      for(const k of ["sector","korea_type","vietnam_type","coop_type"])if(fm[k])it[k]=fm[k];}}catch(e){}
  S.settings.lastLoad=now();S.settings.lastErrors=plan.errors;
  const msg=`노트 ${plan.total}개 확인 · 새 자료 ${plan.add.length} · 변경 ${plan.upd.length} · 기존 문헌과 연결 ${plan.link.length} · 그대로 ${plan.same} · 범위 밖 ${plan.out}`+(plan.errors.length?` · 오류 ${plan.errors.length}`:"");
  logSync("obsidian","가져오기",plan.errors.length?"warn":"ok",msg);save();return msg;
}

async function dfetch(url,opt={}){
  if(!driveOn())throw new Error("구글 드라이브 연결이 끊겼습니다. 다시 연결하세요.");
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+DRIVE.token},opt.headers||{})}));
  if(r.status===401){DRIVE.token=null;throw new Error("드라이브 권한이 만료됐습니다. 다시 연결하세요.");}
  if(!r.ok){let m="";try{const d=await r.json();m=d.error&&(d.error.message||d.error.status);}catch(e){}throw new Error(`드라이브 오류 (HTTP ${r.status})${m?": "+m:""}`);}

}

    <div class="tablewrap" style="margin-top:10px"><table><thead><tr><th></th><th>제목</th><th>저자</th><th>학술지</th><th>연도</th><th>원문</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="7" class="hint">결과가 없습니다.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="k_prev" ${KCI_STATE.page<=1?"disabled":""}>이전</button><button class="btn" id="k_next" ${KCI_STATE.page>=pages?"disabled":""}>다음</button><span class="hint">검색 결과의 키워드는 KCI 규격상 상세 조회에서만 제공됩니다.</span></div><div class="progress" id="k_prog"></div></div>`;
  box.querySelectorAll("[data-kd]").forEach(b=>b.onclick=()=>kciDetail(r.records[+b.dataset.kd]));
  $("#k_all").onclick=()=>box.querySelectorAll(".kck:not(:disabled)").forEach(c=>c.checked=true);
  $("#k_prev").onclick=()=>{KCI_STATE.page--;kciSearch();};$("#k_next").onclick=()=>{KCI_STATE.page++;kciSearch();};
  $("#k_imp").onclick=async()=>{const idx=[...box.querySelectorAll(".kck:checked")].map(c=>+c.dataset.i);if(!idx.length)return toast("가져올 논문을 선택하세요.");
    const withDetail=$("#k_detail").checked;let add=0,dup=0,fail=0;
    for(const [n,i] of idx.entries()){let rec=r.records[i];$("#k_prog").textContent=`가져오는 중… ${n+1}/${idx.length}`;
      if(withDetail&&rec.kci_id){try{const d=await api("/api/kci/detail?id="+encodeURIComponent(rec.kci_id));if(d.record&&d.record.kci_id!==rec.kci_id){fail++;}else if(d.record)rec=Object.assign({},rec,Object.fromEntries(Object.entries(d.record).filter(([k,v])=>v&&!(Array.isArray(v)&&!v.length))));}catch(e){fail++;}}
      const res=addLiterature(kciToLit(rec),"kci");if(res.dup)dup++;else add++;}
    logSync("kci","가져오기",fail?"warn":"ok",`${add}건 등록, 중복 ${dup}건 제외${fail?`, 상세 조회 실패 ${fail}건(기본 서지만 등록)`:""}`);save();
    toast(`${add}건을 문헌 목록에 등록했습니다${dup?` (중복 ${dup}건 제외)`:""}.`);kciRenderResults();};
}

PANES.upload={html:()=>`<div class="panel"><h2>파일 업로드</h2><p class="hint">원문 파일(PDF 등)을 프로젝트 저장소에 올리고 문헌과 연결합니다. 파일은 저장소에 두고, 앱에는 파일 정보와 위치만 기록합니다.</p>

  ${!driveOn()&&!VAULT?`<div class="notice" style="margin-top:12px">저장할 곳이 연결되지 않았습니다. 구글 드라이브(Google Drive 가져오기 탭) 또는 옵시디언 볼트(연동 설정)를 먼저 연결하세요.</div>`:""}</div>

 bind:()=>{const b=$("#up_go");if(b)b.onclick=uploadFiles;}};
function vaultFileDir(){const x=vpath();return x.legacy?"3-Resources/원문":x.dir+"/원문";}
function filesTable(){if(!S.files.length)return `<p class="hint">아직 연결된 원문 파일이 없습니다.</p>`;
  return `<div class="tablewrap"><table><thead><tr><th>파일</th><th>위치</th><th>크기</th><th>문헌</th><th>상태</th></tr></thead><tbody>${S.files.map(f=>{const it=litByFile(f);return `<tr><td>${f.link?`<a href="${esc(f.link)}" target="_blank" rel="noopener">${esc(f.name)}</a>`:esc(f.name)}</td><td>${f.location==="drive"?`구글 드라이브<div class="hint" style="margin:0">ID ${esc(f.drive_id)}</div>`:`볼트<div class="hint" style="margin:0">${esc(f.path)}</div>`}</td><td>${fmtSize(f.size)}</td><td>${it?esc(it.title.slice(0,50)):'<span class="tag warn">연결 안 됨</span>'}</td><td>${esc(f.status)}</td></tr>`;}).join("")}</tbody></table></div>`;}
async function uploadFiles(){
  const fl=[...($("#up_file").files||[])];if(!fl.length)return toast("올릴 파일을 선택하세요.");
  const to=(document.querySelector('input[name="up_to"]:checked')||{}).value;if(!to)return toast("저장 위치를 고르세요.");
  const litSel=$("#up_lit").value,p=$("#up_prog");let ok=0,skip=0,errs=[];let parent=null;
  try{if(to==="drive")parent=(await driveEnsureProjectFolder()).id;else if(!(await vaultPermission(true)))throw new Error("볼트 쓰기 권한이 필요합니다.");}catch(e){logSync(to,"업로드","error",e.message);return toast(e.message);}
  for(const [n,file] of fl.entries()){p.textContent=`올리는 중… ${n+1}/${fl.length} ${file.name}`;
    const same=S.files.find(f=>f.name===file.name&&f.size===file.size);
    if(same&&!confirm(`"${file.name}"과 이름·크기가 같은 파일이 이미 있습니다(${same.location==="drive"?"드라이브":"볼트"}). 그래도 올릴까요?`)){skip++;continue;}
    try{let rec;
      if(to==="drive"){const f=await driveUpload(file,parent);rec=fileRecFromDrive(f);rec.size=file.size;if(f.md5Checksum&&S.files.some(x=>x.md5===f.md5Checksum))rec.status="연결됨 · 같은 내용 파일 있음";}
      else{let path=`${vaultFileDir()}/${safeName(file.name)}`;await writeBinary(VAULT,path,file);rec={file_id:uid(),project_id:S.id,lit_id:"",name:file.name,mime:file.type,size:file.size,location:"vault",path,link:"",md5:"",added:now(),status:"볼트에 저장(드라이브 데스크톱 앱이 동기화)"};}
      let it=litSel?S.items.find(x=>x.id===litSel):null;
      if(!it){const r=addLiterature({title:titleFromName(file.name),has_fulltext:"보유"},"upload");it=r.item||r.dup.item;}
      attachFile(rec,it);ok++;
    }catch(e){errs.push(file.name+": "+e.message);}}
  logSync(to==="drive"?"drive":"obsidian","업로드",errs.length?"warn":"ok",`${ok}개 업로드·연결${skip?`, ${skip}개 건너뜀`:""}${errs.length?`, 오류: ${errs.join(" / ")}`:""}`);save();
  p.textContent="";toast(errs.length?`${ok}개 완료, ${errs.length}개 실패: ${errs[0]}`:`${ok}개 파일을 올리고 문헌에 연결했습니다.`);render();
}

    else{if(!o.korea_party||!o.year)return toast("연도와 한국 측 기관을 입력하세요.");const it=normalizeItem(newItem("mou",o,"manual"));classifyRule(it,false);S.items.push(it);}

/* 기존 목록 */
PANES.list={html:()=>`<div class="panel"><h2>기존 문헌 목록 가져오기</h2><p class="hint">RISS·KCI에서 내보낸 엑셀, CSV, 또는 AI WIKI에서 내보낸 프로젝트 JSON의 문헌을 가져옵니다. 이미 있는 문헌(DOI·KCI ID·제목+연도 일치)은 건너뜁니다.</p>
  <label for="c_file">파일 선택 (.xlsx, .xls, .csv, .json)</label><input type="file" id="c_file" accept=".xlsx,.xls,.csv,.json" multiple>
  <label for="c_kind">자료 종류</label><select id="c_kind"><option value="auto">자동 판별 (mou_id 열이 있으면 MOU)</option><option value="paper">문헌(논문·보고서)</option><option value="mou">분석 데이터(MOU)</option></select>
  <div id="c_preview" class="hint" style="margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="btn primary" id="c_add" disabled>문헌 목록에 추가</button></div>
  <h3>RISS에서 엑셀 받는 법</h3><ol class="steps"><li>riss.kr에서 검색 → 국내학술논문 탭</li><li>논문 체크 → 내보내기 → 엑셀</li><li>받은 파일을 여기에 올립니다.</li></ol></div>`,
 bind:()=>{let PEND=[];
  $("#c_file").onchange=async e=>{PEND=[];const sel=$("#c_kind").value;const msg=[];
    for(const f of e.target.files){try{
      if(f.name.toLowerCase().endsWith(".json")){const d=JSON.parse(await f.text());const its=(d.projects||[]).flatMap(p=>p.items||[]).concat(d.items||[]);its.filter(i=>i.kind==="paper"||i.kind==="mou").forEach(i=>{const c=JSON.parse(JSON.stringify(i));["id","project_id","path","mtime","origin","files","my_view","relevance","relevance_reason","cls_by","review_status"].forEach(k=>delete c[k]);PEND.push({kind:i.kind,o:c,src:"json"});});msg.push(`${f.name}: ${its.length}건`);continue;}
      const rows=await readFile(f);let k=sel;if(k==="auto")k=rows[0]&&Object.keys(rows[0]).some(x=>/mou_id|korea_party/i.test(x))?"mou":"paper";const mapped=rows.map(mapRow).filter(o=>k==="mou"?o.korea_party:o.title);
      mapped.forEach(o=>{if(k==="paper"&&o.keywords)o.keywords=o.keywords.split(/[;,|]/).map(x=>x.trim()).filter(Boolean);if(o.year)o.year=parseInt(String(o.year).match(/\d{4}/)?.[0])||"";if(o.source){o.sources=[o.source];delete o.source;}PEND.push({kind:k,o,src:f.name.toLowerCase().endsWith(".csv")?"csv":"excel"});});msg.push(`${f.name}: ${k==="mou"?"MOU":"문헌"} ${mapped.length}건`);
    }catch(err){msg.push(`${f.name}: 읽지 못함 (${err.message})`);}}
    $("#c_preview").innerHTML=msg.map(esc).join("<br>")+(PEND.length?`<br><b>총 ${PEND.length}건 준비됨</b>`:"");$("#c_add").disabled=!PEND.length;};
  $("#c_add").onclick=()=>{let add=0,dup=0;const mids=new Set(mous().map(m=>m.mou_id).filter(Boolean));
    for(const {kind,o,src} of PEND){if(kind==="paper"){const r=addLiterature(o,src);r.dup?dup++:add++;}else{if(o.mou_id&&mids.has(o.mou_id)){dup++;continue;}const it=normalizeItem(newItem("mou",o,src));it.source=src;classifyRule(it,false);S.items.push(it);if(o.mou_id)mids.add(o.mou_id);add++;}}
    logSync("import","목록 가져오기","ok",`${add}건 추가, 중복 ${dup}건 제외`);PEND=[];save();toast(`${add}건 추가${dup?`, 중복 ${dup}건 제외`:""}.`);render();};
 }};

/* =========================================================
   4단계: 자료 관리 · 키워드 사전 · AI 분류
   ========================================================= */
const KW_TYPES={core:"프로젝트 핵심",confirmed:"연구자 확정",ai:"AI 추천",excluded:"제외"};
const CLS_STATES=["미분류","제안","승인","수정","보류"];
const CLS_L={"미분류":"미분류","제안":"AI 제안","승인":"승인","수정":"연구자 수정","보류":"보류"};
const CONF_L={high:"높음",mid:"중간",low:"낮음"};
const DOC_ALIAS={"학술논문":"학술지 논문","학술지논문":"학술지 논문","보고서":"연구보고서","정책보고서":"연구보고서","학위":"학위논문","석사학위논문":"학위논문","박사학위논문":"학위논문"};
const PAGE_SIZE=50;
function opts(list,v){return list.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");}

/* ---------- 초기화·보정 ---------- */
function normalize4(it){
  if(it.kind!=="paper")return it;
  if(it.doc_type&&DOC_ALIAS[it.doc_type])it.doc_type=DOC_ALIAS[it.doc_type];
  if(!Array.isArray(it.kw_ai))it.kw_ai=[];if(!Array.isArray(it.kw_confirmed))it.kw_confirmed=[];if(!Array.isArray(it.history))it.history=[];
  if(it.topic_ai===undefined)it.topic_ai=null;if(it.topic_final===undefined)it.topic_final="";
  if(!it.cls_state)it.cls_state="미분류";
  if(!it.decision)it.decision="미판단";
  if(!it.doc_type_state)it.doc_type_state=it.doc_type?(it.source==="manual"?"연구자확정":"출처정보"):"미확인";
  if(it.doc_type_ai===undefined)it.doc_type_ai=null;
  return it;
}
function initProject4(p){
  if(!Array.isArray(p.keywords)){p.keywords=[];(p.settings.keywords||[]).forEach(t=>p.keywords.push(mkKw(t,"core","프로젝트")));}
  if(!Array.isArray(p.topics)){p.topics=p.keywords.filter(k=>k.type==="core").map(k=>({topic_id:uid(),name:k.term,desc:"",kw_ids:[k.kw_id],by:"프로젝트"}));}
}
function mkKw(term,type,by){return {kw_id:"K"+uid(),term:String(term).trim(),type,synonyms:[],parent:"",note:"",by,similar_to:"",created:now()};}
function syncCoreFromSettings(){const terms=S.settings.keywords||[];for(const t of terms){const m=kwMatch(t);if(m&&m.rel!=="유사"){if(m.kw.type!=="core"&&m.kw.type!=="excluded")m.kw.type="core";}else S.keywords.push(mkKw(t,"core","프로젝트"));}}
function syncSettingsFromCore(){S.settings.keywords=S.keywords.filter(k=>k.type==="core").map(k=>k.term);}

/* ---------- 키워드 사전 ---------- */
const kwN=t=>String(t||"").toLowerCase().replace(/\([^)]*\)/g,m=>" "+m.slice(1,-1)+" ").replace(/[^0-9a-z가-힣]/g,"");
const kwById=id=>S.keywords.find(k=>k.kw_id===id);
const kwTerms=ids=>(ids||[]).map(id=>(kwById(id)||{}).term).filter(Boolean);
function bigrams(s){const a=new Set();for(let i=0;i<s.length-1;i++)a.add(s.slice(i,i+2));return a;}
function sim(a,b){const A=bigrams(a),B=bigrams(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++;});return n/(A.size+B.size-n);}
/* 용어를 사전과 비교: 중복(같은 말) · 동의어(등록된 동의어) · 유사(포함·비슷한 글자) */
function kwMatch(term,exceptId){
  const t=kwN(term);if(!t)return null;let best=null;
  for(const k of S.keywords){if(k.kw_id===exceptId)continue;
    if(kwN(k.term)===t)return {kw:k,rel:"중복"};
    if((k.synonyms||[]).some(s=>kwN(s)===t))return {kw:k,rel:"동의어"};
    const kn=kwN(k.term);const sc=(t.length>=2&&kn.length>=2&&(kn.includes(t)||t.includes(kn)))?0.8:sim(t,kn);
    if(sc>=0.5&&(!best||sc>best.sc))best={kw:k,rel:"유사",sc};}
  return best;
}
const kwTermsAll=k=>[k.term,...(k.synonyms||[])].map(x=>x.toLowerCase()).filter(Boolean);
function docText(it){return [it.title,it.title_en,(it.keywords||[]).join(" "),it.abstract,it.summary].join(" ").toLowerCase();}
function phraseTokens(term){return String(term||"").toLowerCase().replace(/\(([^)]*)\)/g," $1 ").split(/[^0-9a-z가-힣]+/).map(x=>x.replace(/(의|과|와|을|를|에|및)$/,"")).filter(x=>x.length>=2&&!KW_STOP.has(x));}
function termInText(term,tn){const n=kwN(term);if(n.length>=2&&tn.includes(n))return "full";const tk=phraseTokens(term);return tk.length>1&&tk.every(t=>tn.includes(t))?"tokens":"";}
function docHasKw(it,k){if((it.kw_confirmed||[]).includes(k.kw_id))return true;const tn=kwN(docText(it));return kwTermsAll(k).some(t=>termInText(t,tn));}
function kwDocCount(k){return papers().filter(it=>(it.kw_confirmed||[]).includes(k.kw_id)).length;}
function kwChildren(k){return S.keywords.filter(x=>x.parent===k.kw_id);}
function addHistory(it,field,from,to,by,note){it.history=it.history||[];it.history.unshift({t:now(),field,from:from||"",to:to||"",by,note:note||""});it.history=it.history.slice(0,50);}
/* 분류 결과에서 나온 새 키워드를 사전에 'AI 추천'으로 등록(확정 키워드는 건드리지 않음) */
function registerAiKeywords(terms){let added=0;for(const t of terms){const term=String(t).trim();if(term.length<2)continue;const m=kwMatch(term);if(m&&m.rel!=="유사")continue;if(S.keywords.some(k=>k.type==="ai"&&kwN(k.term)===kwN(term)))continue;
  const k=mkKw(term,"ai","AI");if(m)k.similar_to=m.kw.kw_id;S.keywords.push(k);added++;}return added;}

/* ---------- 문헌 유형 판별 (서지정보·출처 기반) ---------- */
function classifyDocType(it){
  const j=[it.journal,it.publisher].join(" "),t=it.title||"",ev=[];
  if(it.source==="kci"&&it.kci_id){ev.push("자료 출처: KCI 논문(articleSearch)");return {value:"학술지 논문",confidence:"high",reason:"KCI 학술지 논문 데이터베이스에서 가져온 문헌",evidence:ev};}
  if(/학위|대학원|박사|석사|thesis|dissertation/i.test(j+" "+t)){ev.push("학술지·발행처: "+j);return {value:"학위논문",confidence:/학위논문|thesis|dissertation/i.test(j+t)?"high":"mid",reason:"발행처나 제목에 학위·대학원 표기가 있음",evidence:ev};}
  if(/학술대회|발표논문집|proceedings|conference|심포지엄/i.test(j+" "+t)){ev.push("학술지·발행처: "+j);return {value:"학술대회 발표",confidence:"mid",reason:"학술대회·발표논문집 표기",evidence:ev};}
  if(/연구원|kiep|kotra|kdi|보고서|정책연구|연구총서|무역협회|진흥원|issue paper|working paper|오늘의 세계경제/i.test(j+" "+t)){ev.push("발행처: "+j);return {value:"연구보고서",confidence:/보고서|연구총서|working paper/i.test(j+t)?"high":"mid",reason:"연구기관·보고서 계열 발행처",evidence:ev};}
  if(it.journal&&/\d/.test(it.volume||"")){ev.push("학술지명: "+it.journal,"권호: "+it.volume);return {value:"학술지 논문",confidence:"mid",reason:"학술지명과 권호 정보가 있음",evidence:ev};}
  if(it.journal){ev.push("학술지·발행처: "+it.journal);return {value:"학술지 논문",confidence:"low",reason:"게재처만 있고 권호가 없어 불확실",evidence:ev};}
  return {value:"",confidence:"low",reason:"유형을 판단할 서지정보가 부족함",evidence:["제목만 있음"]};
}
function applyDocType(it,sug,by){
  it.doc_type_ai=Object.assign({},sug,{by,at:now()});
  if(it.doc_type_state==="연구자확정")return;
  if(sug.value&&it.doc_type===sug.value){if(it.doc_type_state!=="자동확정")it.doc_type_state="자동확정";return;}      // 출처 정보와 판별 일치
  if(sug.confidence==="high"&&sug.value&&!it.doc_type){addHistory(it,"문헌 유형","",sug.value,by,"근거 충분 — 자동 확정");it.doc_type=sug.value;it.doc_type_state="자동확정";return;}
  it.doc_type_state="검토요청";                                                                       // 불확실하거나 출처 정보와 다름 → 연구자 확인
}

/* ---------- 토픽·키워드 분류 (규칙 기반) ---------- */
function topicTerms(tp){const kws=(tp.kw_ids||[]).map(kwById).filter(Boolean);return [tp.name,...kws.flatMap(k=>[k.term,...(k.synonyms||[])])].filter(Boolean);}
let TOK_IDF=null;
function buildIdf(){const P=papers(),N=P.length||1,df={};const toks=new Set(S.topics.flatMap(tp=>topicTerms(tp).flatMap(t=>[kwN(t),...phraseTokens(t)])).filter(t=>t.length>=2));
  const texts=P.map(p=>kwN(docText(p)));for(const t of toks)df[t]=texts.filter(x=>x.includes(t)).length;
  TOK_IDF={};for(const t of toks){const r=df[t]/N;TOK_IDF[t]=r>0.6?0:Math.log((N+1)/(df[t]+1));}return TOK_IDF;}
function ruleTopic(it){
  if(!TOK_IDF)buildIdf();
  const fields=[["제목",kwN(it.title),2],["서지 키워드",kwN((it.keywords||[]).join(" ")),1.5],["초록·요약",kwN((it.abstract||"")+" "+(it.summary||"")),1]];
  const ev=fields.filter(f=>f[1]).map(f=>f[0]);
  const fieldHit=t=>{let best=0;for(const [,txt,fw] of fields)if(txt&&txt.includes(t))best=Math.max(best,fw);return best;};
  const scored=S.topics.map(tp=>{let s=0,strong=false;const hit=new Set();
    for(const term of topicTerms(tp)){const full=kwN(term);if(full.length<2)continue;const fh=fieldHit(full);
      if(fh){s+=(TOK_IDF[full]??Math.log(2))*1.5*fh;hit.add(term);strong=true;continue;}                 // 구절 전체 일치: 강한 단서
      const toks=phraseTokens(term).filter(t=>t!==full);if(toks.length<2)continue;
      const m=toks.filter(t=>fieldHit(t));if(!m.length)continue;
      const w=m.reduce((a,t)=>a+(TOK_IDF[t]??Math.log(2))*fieldHit(t),0);
      if(m.length>=2){s+=w;strong=true;}else s+=w*0.3;                                                   // 여러 단어 중 한 단어만: 약한 단서
      m.forEach(t=>hit.add(t));}
    return {tp,s,strong,hit:[...hit]};}).sort((a,b)=>b.s-a.s);
  const b=scored[0],s2=scored[1]?scored[1].s:0;
  const excl=S.keywords.filter(k=>k.type==="excluded").flatMap(kwTermsAll).filter(t=>kwN(docText(it)).includes(kwN(t)));
  if(!b||b.s<0.8)return {topic:"",keywords:[],reason:"프로젝트 토픽과 일치하는 단서가 제목·키워드·초록에 없거나 너무 흔한 단어뿐임",evidence:ev,confidence:"low",excluded:excl};
  if(!b.strong)return {topic:"",keywords:b.hit.slice(0,6),reason:`키워드 일부 단어만 일치하는 약한 단서뿐이라 토픽을 정하지 않음 (후보: ${b.tp.name} — ${b.hit.slice(0,3).join(", ")})`,evidence:ev,confidence:"low",excluded:excl};

const KW_STOP=new Set([...STOP,"중심으로","관한","대한","방안","연구","분석","효과","영향","사례","현황","과제","비교","고찰","탐색","검토","실증","the","an","of","and","for","in","on","to","with","between","korea","korean","study","구조","모델","분야","체계","방향","개선","중심","활용","관계","정책","산업","경제","국가","한국","시장"]);

async function classifyPapersAI(batch){

    const v=parseInt(r.relevance);if(v>=1&&v<=5&&it.cls_by!=="연구자"){it.relevance=v;it.relevance_reason=r.relevance_reason||it.relevance_reason;}

    newKw.push(...(r.keywords||[]));
    const dtv=DOC_ALIAS[r.doc_type]||r.doc_type;applyDocType(it,{value:LIT_TYPES.includes(dtv)?dtv:"",confidence:["high","mid","low"].includes(r.doc_type_confidence)?r.doc_type_confidence:"low",reason:r.doc_type_reason||"",evidence:["AI 판단(서지정보)"]},"AI");

async function runClassification(list,onProg){

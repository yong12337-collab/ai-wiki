  if(KWTAB==="dup"){body=pairs.length?`<p class="hint">사전 안에서 같거나 비슷한 키워드입니다. 병합하면 한쪽이 다른 쪽의 동의어가 되고, 문헌 연결도 옮겨집니다.</p><div class="tablewrap" style="max-height:55vh"><table><thead><tr><th>키워드 A</th><th>키워드 B</th><th>관계</th><th></th></tr></thead><tbody>${pairs.map(([a,b,rel])=>`<tr><td>${esc(a.term)} <span class="hint">${KW_TYPES[a.type]}</span></td><td>${esc(b.term)} <span class="hint">${KW_TYPES[b.type]}</span></td><td>${rel}</td><td><button class="btn sm" data-merge="${b.kw_id}" data-into="${a.kw_id}">B를 A에 병합</button><button class="btn sm" data-merge="${a.kw_id}" data-into="${b.kw_id}">A를 B에 병합</button><button class="btn sm" data-keep="${a.kw_id}|${b.kw_id}">따로 유지</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="hint">중복·유사 키워드가 없습니다.</p>`;}
  if(KWTAB==="topic"){body=`<p class="hint">토픽은 연구 주제별 분류 항목입니다(문헌 유형과 별개). 토픽에 키워드를 연결하면 규칙 기반 분류의 단서가 됩니다.</p><div class="row" style="flex-wrap:nowrap"><input type="text" id="tn_name" placeholder="새 토픽"><button class="btn primary" id="tn_add">추가</button></div>
    <div class="tablewrap" style="margin-top:10px;max-height:55vh"><table><thead><tr><th>토픽</th><th>연결 키워드</th><th>확정 문헌</th><th>AI 제안 문헌</th><th></th></tr></thead><tbody>${S.topics.map(t=>`<tr data-t="${t.topic_id}"><td><input type="text" class="tp_name" value="${esc(t.name)}">${t.status==="제안"?'<span class="tag warn">AI 제안</span>':""}</td><td><select class="tp_kw" multiple size="3">${S.keywords.filter(k=>k.type!=="ai").map(k=>`<option value="${k.kw_id}" ${(t.kw_ids||[]).includes(k.kw_id)?"selected":""}>${esc(k.term)}</option>`).join("")}</select></td><td>${papers().filter(p=>p.topic_final===t.name).length}</td><td>${papers().filter(p=>p.topic_ai&&p.topic_ai.topic===t.name).length}</td><td><button class="btn sm" data-tsave="${t.topic_id}">저장</button><button class="btn sm danger" data-tdel="${t.topic_id}">삭제</button></td></tr>`).join("")}</tbody></table></div>`;}
  return `<h2>키워드 관리</h2><div class="srctabs">${tabs.map(([k,l])=>`<button data-kt="${k}" aria-selected="${k===KWTAB}">${l}</button>`).join("")}</div>${body}<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="kw_close">닫기</button></div>`;
}
function kwDupPairs(){const ks=S.keywords.filter(k=>k.type!=="ai"),out=[];S.kwKeep=S.kwKeep||[];for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){const a=ks[i],b=ks[j];if(S.kwKeep.includes(a.kw_id+"|"+b.kw_id)||S.kwKeep.includes(b.kw_id+"|"+a.kw_id))continue;const na=kwN(a.term),nb=kwN(b.term);let rel=null;
  if(na===nb)rel="중복";else if((a.synonyms||[]).some(s=>kwN(s)===nb)||(b.synonyms||[]).some(s=>kwN(s)===na))rel="동의어 겹침";else if(na.length>=2&&nb.length>=2&&(na.includes(nb)||nb.includes(na)))rel="포함 관계";else if(sim(na,nb)>=0.5)rel="비슷한 표기";
  if(rel&&!(rel==="포함 관계"&&(a.parent===b.kw_id||b.parent===a.kw_id)))out.push([a,b,rel]);}return out;}
function mergeKw(srcId,intoId){const s=kwById(srcId),t=kwById(intoId);if(!s||!t)return;t.synonyms=[...new Set([...(t.synonyms||[]),s.term,...(s.synonyms||[])].filter(x=>kwN(x)!==kwN(t.term)))];
  for(const p of papers()){if(p.kw_confirmed.includes(srcId)){p.kw_confirmed=[...new Set(p.kw_confirmed.map(x=>x===srcId?intoId:x))];addHistory(p,"확정 키워드",s.term,t.term,"연구자","키워드 병합");}}
  S.keywords.forEach(k=>{if(k.parent===srcId)k.parent=intoId;});S.topics.forEach(tp=>{tp.kw_ids=[...new Set((tp.kw_ids||[]).map(x=>x===srcId?intoId:x))];});
  S.keywords=S.keywords.filter(k=>k.kw_id!==srcId);if(t.type==="core"||s.type==="core"){if(s.type==="core")t.type="core";syncSettingsFromCore();}}
function bindKwDialog(){const B=$("#dlgBody");const re=()=>{save();kwDialog();};
  B.querySelectorAll("[data-kt]").forEach(b=>b.onclick=()=>kwDialog(b.dataset.kt));$("#kw_close").onclick=()=>{$("#dlg").close();render();};
  const add=$("#kn_add");if(add)add.onclick=()=>{const t=$("#kn_term").value.trim();if(!t)return;const m=kwMatch(t);if(m&&m.rel!=="유사")return toast(`이미 있는 키워드 "${m.kw.term}"과 ${m.rel}입니다.`);if(m&&!confirm(`"${t}"은(는) 기존 "${m.kw.term}"과 비슷합니다. 그래도 추가할까요?`))return;S.keywords.push(mkKw(t,$("#kn_type").value,"연구자"));if($("#kn_type").value==="core")syncSettingsFromCore();re();};
  B.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>{const tr=b.closest("tr"),k=kwById(b.dataset.save);const term=tr.querySelector(".kw_term").value.trim();if(!term)return toast("키워드를 비울 수 없습니다.");const m=kwMatch(term,k.kw_id);if(m&&m.rel==="중복")return toast(`"${m.kw.term}"과 중복입니다. 중복·유사 탭에서 병합하세요.`);
    const par=tr.querySelector(".kw_parent").value;if(par){let p=kwById(par),guard=0;while(p&&guard++<20){if(p.kw_id===k.kw_id)return toast("상위 개념이 서로를 가리키게 만들 수 없습니다.");p=kwById(p.parent);}}
    k.term=term;k.type=tr.querySelector(".kw_type").value;k.synonyms=splitKw(tr.querySelector(".kw_syn").value);k.parent=par;syncSettingsFromCore();toast("키워드를 저장했습니다.");re();});
  B.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const k=kwById(b.dataset.del);const n=kwDocCount(k);if(k.type!=="ai"&&!confirm(`"${k.term}"을(를) 삭제할까요?${n?` 문헌 ${n}편의 확정 키워드에서도 빠집니다.`:""}`))return;
    papers().forEach(p=>{if(p.kw_confirmed.includes(k.kw_id)){p.kw_confirmed=p.kw_confirmed.filter(x=>x!==k.kw_id);addHistory(p,"확정 키워드",k.term,"","연구자","키워드 삭제");}});S.keywords.forEach(x=>{if(x.parent===k.kw_id)x.parent="";});S.topics.forEach(t=>{t.kw_ids=(t.kw_ids||[]).filter(x=>x!==k.kw_id);});S.keywords=S.keywords.filter(x=>x.kw_id!==k.kw_id);syncSettingsFromCore();re();});
  B.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{const k=kwById(b.dataset.acc);k.type="confirmed";k.by="연구자";k.similar_to="";const n=papers().filter(p=>(p.kw_ai||[]).some(t=>kwN(t)===kwN(k.term))).length;if(n&&confirm(`AI가 이 키워드를 제안한 문헌 ${n}편에도 확정 키워드로 적용할까요?`)){papers().forEach(p=>{if((p.kw_ai||[]).some(t=>kwN(t)===kwN(k.term))&&!p.kw_confirmed.includes(k.kw_id)){p.kw_confirmed.push(k.kw_id);addHistory(p,"확정 키워드","",k.term,"연구자","AI 추천 승인");}});}re();});
  B.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{const k=kwById(b.dataset.ex);k.type="excluded";k.by="연구자";re();});
  B.querySelectorAll("[data-merge]").forEach(b=>b.onclick=()=>{const s=kwById(b.dataset.merge),t=kwById(b.dataset.into);if(!confirm(`"${s.term}"을(를) "${t.term}"에 병합할까요? "${s.term}"은(는) 동의어가 됩니다.`))return;mergeKw(s.kw_id,t.kw_id);re();});
  B.querySelectorAll("[data-keep]").forEach(b=>b.onclick=()=>{S.kwKeep=S.kwKeep||[];S.kwKeep.push(b.dataset.keep);re();});
  const tadd=$("#tn_add");if(tadd)tadd.onclick=()=>{const n=$("#tn_name").value.trim();if(!n)return;if(S.topics.some(t=>kwN(t.name)===kwN(n)))return toast("같은 토픽이 있습니다.");S.topics.push({topic_id:uid(),name:n,desc:"",kw_ids:[],by:"연구자"});re();};
  B.querySelectorAll("[data-tsave]").forEach(b=>b.onclick=()=>{const tr=b.closest("tr"),t=S.topics.find(x=>x.topic_id===b.dataset.tsave);const nn=tr.querySelector(".tp_name").value.trim();if(!nn)return;
    if(nn!==t.name){papers().forEach(p=>{if(p.topic_final===t.name){addHistory(p,"최종 토픽",t.name,nn,"연구자","토픽 이름 변경");p.topic_final=nn;}if(p.topic_ai&&p.topic_ai.topic===t.name)p.topic_ai.topic=nn;});}
    t.name=nn;t.kw_ids=[...tr.querySelector(".tp_kw").selectedOptions].map(o=>o.value);t.status="";toast("토픽을 저장했습니다.");re();});
  B.querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{const t=S.topics.find(x=>x.topic_id===b.dataset.tdel);const n=papers().filter(p=>p.topic_final===t.name).length;if(!confirm(`토픽 "${t.name}"을(를) 삭제할까요?${n?` 확정된 문헌 ${n}편은 미분류로 돌아갑니다.`:""}`))return;
    papers().forEach(p=>{if(p.topic_final===t.name){addHistory(p,"최종 토픽",t.name,"","연구자","토픽 삭제");p.topic_final="";p.cls_state="미분류";p.review_status="미검토";}if(p.topic_ai&&p.topic_ai.topic===t.name){p.topic_ai.topic="";if(p.cls_state==="제안")p.cls_state="미분류";}});S.topics=S.topics.filter(x=>x!==t);re();});
}

/* =========================================================
   5단계: AI 기반 문헌 분석 · 토픽 모델링 · 연구 방향
   흐름: 대상 선택 → ① 문헌 카드(문헌 단위) → ② 통계 토픽 군집
        → ③ 토픽 해석(토픽 단위) → ④ 종합(토픽 요약만 사용) → 버전 저장
   ========================================================= */
function initProject5(p){
  if(!p.cards||typeof p.cards!=="object")p.cards={};
  if(!Array.isArray(p.analyses))p.analyses=[];
  if(!Array.isArray(p.viewHistory))p.viewHistory=[{v:1,t:p.created||now(),view:p.settings.view||"",purpose:p.settings.purpose||"",questions:p.settings.questions||"",by:"프로젝트 생성"}];
}
function curView(){return S.viewHistory[S.viewHistory.length-1];}
function recordView(by){const s=S.settings,c=curView();if(c&&c.view===s.view&&c.purpose===s.purpose&&c.questions===s.questions)return;S.viewHistory.push({v:(c?c.v:0)+1,t:now(),view:s.view||"",purpose:s.purpose||"",questions:s.questions||"",by});}

/* ---------- 텍스트 처리 (한국어 조사 제거 + 복합어 2글자 조각) ---------- */
const JOSA=/(으로써|으로서|에서의|에서는|으로는|에서|으로|에게|까지|부터|이며|이고|하는|하여|하고|하기|과의|와의|들의|들을|들이|들은|의|을|를|은|는|이|가|과|와|에|로|도|만)$/;
const AN_STOP=new Set([...KW_STOP,"관한","대한","위한","통한","따른","있는","있다","하는","한다","되는","이다","및","등","또한","그리고","이러한","따라서","결과","본고","본연구","논문","연구는","분석한","분석하였다","나타났다","제시","제시한다","살펴","통해","대해","대하여","것으로","것을","것이","있음","위해","으로","보인다","있으며","하였다","이를","이에","본","the","a","an","is","are","this","that","by","as","be","from","at","or","which","results","paper","we","our"]);
const NOUN_END=/(효과|결과|성과|국가|평가|증가|단가|차이|제도|정도|인도|속도|태도|빈도|한도|용도|경로|진로|회의|협의|논의|합의|정의|주의|의의|거래|사이|요인은|관계|단계|세계|업계|체계|합계|통계)$/;
function stripJosa(w){if(NOUN_END.test(w))return w;const m=w.match(JOSA);if(!m)return w;const r=w.slice(0,-m[1].length);return r.length>=2||m[1].length>=2?r:w;}
function anTokens(text){const out=[];for(let w of String(text||"").toLowerCase().replace(/([a-z0-9])([가-힣])/g,"$1 $2").replace(/([가-힣])([a-z])/g,"$1 $2").split(/[^0-9a-z가-힣]+/)){if(!w)continue;if(/^[가-힣]+$/.test(w))w=stripJosa(w);if(w.length<2||AN_STOP.has(w)||/^\d+$/.test(w))continue;out.push(w);if(/^[가-힣]{4,}$/.test(w))for(let i=0;i<w.length-1;i++)out.push("·"+w.slice(i,i+2));}return out;}
function anText(it){const c=(S.cards[it.id]||{}).card||{};return {title:it.title||"",kw:[...(it.keywords||[]),...kwTerms(it.kw_confirmed)].join(" "),body:[it.abstract||it.summary||"",["purpose","claims","conclusion","object"].map(k=>c[k]&&c[k]!=="미확인"?c[k]:"").join(" ")].join(" ")};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);}
const docHash=it=>hashStr([it.title,it.abstract,it.summary,(it.keywords||[]).join("|"),it.year].join("§"));
function rng(seed){return ()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------- ① 문헌 카드 ---------- */
const METHOD_RULES=[["계량·실증 분석",/회귀|패널|중력모형|gravity|\bvar\b|dea|cge|gtap|추정|실증|계량|통계|regression|panel|모형/i],["사례 연구",/사례|case stud/i],["설문 조사",/설문|survey/i],["질적 연구",/인터뷰|면담|심층|질적|qualitative/i],["정책·제도 분석",/정책|제도|법적|법률|규정|협정/],["비교 연구",/비교|compar/i],["문헌 연구",/문헌|선행연구|literature review/i]];
const OBJ_RULES=[["베트남",/베트남|vietnam|對베/i],["한국",/한국|한·|한-|korea/i],["중국",/중국|한중|china/i],["일본",/일본|한일|japan/i],["ASEAN",/아세안|asean|동남아/i],["CLMV",/clmv|캄보디아|라오스|미얀마/i]];
function splitSents(t){return String(t||"").replace(/\s+/g," ").split(/(?<=[.?!])\s+|(?<=다\.)\s*/).map(s=>s.trim()).filter(s=>s.length>8);}
function ruleCard(it){
  const abs=it.abstract||it.summary||"",txt=(it.title||"")+" "+abs,ss=splitSents(abs),U="미확인";
  const pick=re=>{const s=ss.find(x=>re.test(x));return s?s.slice(0,180):U;};
  const methods=METHOD_RULES.filter(([,re])=>re.test(txt)).map(([n])=>n);
  const sec=Object.keys(SECTOR_RULES).filter(k=>SECTOR_RULES[k].some(w=>txt.toLowerCase().includes(w))).slice(0,2);
  const objs=OBJ_RULES.filter(([,re])=>re.test(txt)).map(([n])=>n);
  return {purpose:pick(/목적|목표|살펴보|분석하는|규명|검토하|고찰|밝히/),questions:pick(/\?|인가|는가|여부/),object:objs.length||sec.length?[...objs,...sec].join(", "):U,
    method:methods.length?methods.join(", "):U,claims:pick(/나타났|확인되|드러났|보여준|밝혀졌|분석 결과/),conclusion:pick(/시사|결론|제언|함의|필요하다|요구된다/),
    basis:abs?"제목·초록(원문 미분석)":"제목만(초록 없음)",by:"규칙(초록 문장 추출)"};
}
async function aiCards(batch){
  const items=batch.map((it,i)=>({i,title:it.title,year:it.year,journal:it.journal,keywords:(it.keywords||[]).join(", "),abstract:(it.abstract||it.summary||"").slice(0,1500)}));
  const prompt=`${projectContext()}\n\n다음 문헌마다 연구 목적, 연구 질문, 분석 대상, 연구 방법, 주요 주장, 결론을 추출하세요. 주어진 제목·초록에 실제로 있는 내용만 쓰고, 없으면 정확히 "미확인"이라고 쓰세요. 원문을 읽은 것처럼 추측하지 마세요. 각 항목은 한두 문장. basis에는 사용한 정보("제목", "초록")를 적으세요.\n반드시 JSON 배열만 출력: [{"i":번호,"purpose":"","questions":"","object":"","method":"","claims":"","conclusion":"","basis":""}]\n\n문헌:\n${JSON.stringify(items)}`;
  const res=parseJSON(await callClaude(prompt,4000));let n=0;
  for(const r of res){const it=batch[r.i];if(!it)continue;const card={};for(const k of ["purpose","questions","object","method","claims","conclusion"])card[k]=String(r[k]||"미확인").trim()||"미확인";
    card.basis=(r.basis||(it.abstract?"제목·초록":"제목"))+"(원문 미분석)";card.by="Claude";S.cards[it.id]={hash:docHash(it),card,at:now(),model:G.model};n++;}
  return n;
}
function cardOf(it){const c=S.cards[it.id];return c&&c.hash===docHash(it)?c.card:null;}

/* ---------- ② 토픽 군집: TF-IDF + 구면 k-평균 ---------- */
function buildMatrix(docs){
  const N=docs.length,tfs=docs.map(d=>{const t=anText(d),m=new Map(),add=(tok,w)=>m.set(tok,(m.get(tok)||0)+w*(tok[0]==="·"?0.4:1));anTokens(t.title).forEach(x=>add(x,2));anTokens(t.kw).forEach(x=>add(x,2));anTokens(t.body).forEach(x=>add(x,1));return m;});
  const df=new Map();tfs.forEach(m=>m.forEach((_,k)=>df.set(k,(df.get(k)||0)+1)));
  const minDf=N>=10?2:1,maxDf=Math.max(2,Math.floor(N*0.5));
  const vocab=[...df.entries()].filter(([,c])=>c>=minDf&&c<=maxDf).map(([k])=>k).sort();const idx=new Map(vocab.map((t,i)=>[t,i]));
  const vecs=tfs.map(m=>{const v=new Float32Array(vocab.length);m.forEach((tf,k)=>{const j=idx.get(k);if(j!==undefined)v[j]=(1+Math.log(tf))*Math.log((N+1)/(df.get(k)+1)+1);});return norm(v);});
  return {vocab,vecs,df};
}
function norm(v){let s=0;for(let i=0;i<v.length;i++)s+=v[i]*v[i];s=Math.sqrt(s);if(s)for(let i=0;i<v.length;i++)v[i]/=s;return v;}
function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;}
const isZero=v=>!v.some(x=>x);
function kmeans(vecs,k,seed){
  const R=rng(seed),n=vecs.length,V=vecs[0].length;let C=[vecs[Math.floor(R()*n)].slice()];
  while(C.length<k){const d=vecs.map(v=>{const m=Math.max(...C.map(c=>dot(v,c)));return Math.max(0,1-m);});const s=d.reduce((a,b)=>a+b,0);let r=R()*s,j=0;for(;j<n;j++){r-=d[j];if(r<=0)break;}C.push(vecs[Math.min(j,n-1)].slice());}
  let lab=new Array(n).fill(-1);
  for(let it=0;it<60;it++){let ch=0;for(let i=0;i<n;i++){let b=0,bs=-2;for(let c=0;c<k;c++){const s=dot(vecs[i],C[c]);if(s>bs){bs=s;b=c;}}if(lab[i]!==b){lab[i]=b;ch++;}}
    C=C.map((_,c)=>{const m=new Float32Array(V);let cnt=0;for(let i=0;i<n;i++)if(lab[i]===c){cnt++;for(let j=0;j<V;j++)m[j]+=vecs[i][j];}return cnt?norm(m):vecs[Math.floor(R()*n)].slice();});if(!ch)break;}
  const inertia=vecs.reduce((a,v,i)=>a+(1-dot(v,C[lab[i]])),0);return {lab,C,inertia};
}
function silhouette(vecs,lab,k){const n=vecs.length;if(k<2||n<3)return 0;let tot=0;
  for(let i=0;i<n;i++){const d=new Array(k).fill(0),c=new Array(k).fill(0);for(let j=0;j<n;j++){if(i===j)continue;d[lab[j]]+=1-dot(vecs[i],vecs[j]);c[lab[j]]++;}
    const a=c[lab[i]]?d[lab[i]]/c[lab[i]]:0;let b=Infinity;for(let q=0;q<k;q++)if(q!==lab[i]&&c[q])b=Math.min(b,d[q]/c[q]);tot+=(b===Infinity||Math.max(a,b)===0)?0:(b-a)/Math.max(a,b);}return tot/n;}
function cluster(vecs,kReq){
  const n=vecs.length,best=k=>{let bb=null;for(let s=1;s<=6;s++){const r=kmeans(vecs,k,s*7919);if(!bb||r.inertia<bb.inertia)bb=r;}bb.k=k;bb.sil=silhouette(vecs,bb.lab,k);return bb;};
  if(kReq)return Object.assign(best(Math.min(kReq,n)),{tried:[[kReq,null]]});
  const kmax=Math.max(2,Math.min(8,Math.floor(n/5)));let res=null;const tried=[];
  for(let k=Math.min(3,kmax);k<=kmax;k++){const r=best(k);tried.push([k,+r.sil.toFixed(3)]);if(!res||r.sil>res.sil)res=r;}
  res.tried=tried;return res;
}
const dispTerm=t=>t[0]!=="·";
const showT=t=>/^[a-z]{2,6}$/.test(t)?t.toUpperCase():t;

}

function applyDraft(dr,run,dirIdx,topicIds){

  else D.pending_chapters=dr.chapters;                                 // 확정된 목차는 덮어쓰지 않음
  const mkC=(c,parent)=>{const cl={claim_id:"L"+uid(),text:c.text,parent:parent||"",by:dr.by,evidence:(c.evidence||[]).map(e=>({ev_id:"E"+uid(),doc_id:e.id,stance:e.stance==="oppose"?"oppose":"support",gist:e.gist||"",gist_by:e.gist?dr.by:"",page:"",location:"",verified:false})),interpretation:"",state:"초안"};D.claims.push(cl);(c.sub||[]).forEach(s=>mkC(s,cl.claim_id));return cl;};
  if(!D.claims.some(c=>c.state==="확정"))D.claims=D.claims.filter(c=>c.by==="연구자");dr.claims.forEach(c=>mkC(c,""));
  D.source={run_id:run.run_id,run_label:run.label,direction:dirIdx!==""?run.directions[+dirIdx]:null,dir_idx:dirIdx,topics:run.topics.filter(t=>topicIds.includes(t.tid)).map(t=>({tid:t.tid,name:t.name})),docs:dr.docs,by:dr.by,at:now()};
  ensure6();
}

function claimStatus(c){if(c.state==="확정")return "확정";const sup=c.evidence.filter(e=>e.stance==="support"&&litById(e.doc_id));if(!sup.length)return "검증 필요";return sup.some(e=>e.verified)?"근거 확인":"근거 있음(위치 미확인)";}

}

/* ---------- 인용 표시와 검토 ---------- */
const CITE_RE=/\[@([A-Za-z0-9_\-]+)(?:,\s*(?:p\.?|pp\.?|쪽)\s*([0-9]+(?:[-–][0-9]+)?))?\]/g;
function parseCites(text){const out=[];let m;CITE_RE.lastIndex=0;while((m=CITE_RE.exec(text)))out.push({doc_id:m[1],page:m[2]||"",at:m.index});return out;}
function syncCitations(w){const found=parseCites(w.text);const keep=[];for(const f of found){let c=w.citations.find(x=>x.doc_id===f.doc_id&&!keep.includes(x));if(!c){c={cite_id:"Q"+uid(),doc_id:f.doc_id,page:"",location:"",verified:false,note:""};}
    if(f.page&&!c.verified)c.page_in_text=f.page;else delete c.page_in_text;keep.push(c);}w.citations=keep;return w.citations;}
function sentencesOf(text){return String(text||"").replace(/\r/g,"").split(/\n+/).flatMap(par=>par.split(/(?<=[.?!。])\s+(?=[^\s\[])/)).map(s=>s.trim()).filter(s=>s.length>=12&&!/^#/.test(s)&&!/^- (근거 후보|활용 문헌):/.test(s)&&!/^\[작성 필요\]/.test(s));}
function tokSet(s){return new Set(anTokens(s).filter(dispTerm));}
function overlap(a,b){if(!a.size||!b.size)return 0;let n=0;a.forEach(x=>{if(b.has(x))n++;});return n/Math.min(a.size,b.size);}
function reviewChapter(chId){const ch=dsChapter(chId),w=S.writing[chId];const D=S.design;
  const focus=tokSet([D.fields.questions.value,D.fields.purpose.value,D.fields.view.value,ch.points,ch.title,...ch.claim_ids.map(id=>(claimById(id)||{}).text||"")].join(" "));
  const old=new Map((w.flags||[]).map(f=>[f.type+"|"+f.sentence,f]));const flags=[];const add=(type,sentence,reason)=>{const o=old.get(type+"|"+sentence);flags.push({type,sentence,reason,status:o?o.status:"검토 필요"});};
  for(const s of sentencesOf(w.text)){const cites=parseCites(s);const claimLike=/\d|증가|감소|영향|효과|나타났|확인|입증|주도|원인|때문|결과적으로|크다|높다|낮다|이다\.?$/.test(s);
    if(!cites.length&&claimLike&&s.length>25)add("근거 부족",s,"근거 문헌 표시([@문헌]) 없이 사실·주장을 서술");
    for(const c of cites){const d=litById(c.doc_id);if(!d)add("인용 오류",s,`등록되지 않은 문헌 ID: ${c.doc_id}`);else if(c.page){const rec=w.citations.find(x=>x.doc_id===c.doc_id);if(!rec||!rec.verified)add("쪽수 미검증",s,"원문 확인 기록 없이 쪽수가 적혀 있음");}}
    if(/[“"「].{8,}[”"」]/.test(s)&&cites.length&&!w.citations.some(x=>cites.some(c=>c.doc_id===x.doc_id)&&x.verified))add("직접 인용 미검증",s,"원문을 확인하지 않은 직접 인용으로 보임");
    const ts=tokSet(s),ov=overlap(ts,focus);if(s.length>30&&ts.size>=4&&ov<0.2)add("관련성 낮음",s,`연구 질문·목적·장 논점과 겹치는 단어가 적음(${(ov*100).toFixed(0)}%)`);}
  const mine=sentencesOf(w.text).map(s=>[s,tokSet(s)]);
  for(const other of D.chapters){if(other.ch_id===chId)continue;const ow=S.writing[other.ch_id];if(!ow||!ow.text)continue;for(const os of sentencesOf(ow.text)){const ot=tokSet(os);for(const [s,t] of mine){if(t.size>=4&&ot.size>=4&&overlap(t,ot)>=0.7)add("다른 장과 중복",s,`「${other.title}」의 문장과 비슷함: ${os.slice(0,60)}…`);}}}
  (w.offtrack||[]).forEach(o=>{if(String(w.text).includes(o.sentence))add("방향 이탈 검토",o.sentence,o.reason);});
  w.flags=flags;w.reviewed_at=now();return flags;}
async function writeChapterAI(chId){const ch=dsChapter(chId),w=S.writing[chId],D=S.design;
  const docs=ch.doc_ids.map(litById).filter(Boolean).slice(0,25).map(d=>{const c=cardOf(d)||{};return {id:d.id,author:d.authors||"미확인",year:d.year||"미확인",title:d.title.slice(0,90),purpose:c.purpose,claims:c.claims,conclusion:c.conclusion};});
  const claims=ch.claim_ids.map(claimById).filter(Boolean).map(c=>({text:c.text,evidence:c.evidence.filter(e=>litById(e.doc_id)).map(e=>({id:e.doc_id,stance:e.stance,gist:e.gist})),interpretation:c.interpretation}));
  const outline=D.chapters.map((c,i)=>`${i+1}. ${c.title}`).join(" / ");
  const prompt=`${projectContext()}\n연구 목적: ${D.fields.purpose.value}\n연구 질문: ${D.fields.questions.value}\n핵심 관점: ${D.fields.view.value}\n전체 목차: ${outline}\n\n지금 쓸 장: 「${ch.title}」\n핵심 논점:\n${ch.points}\n이 장의 주장과 근거:\n${JSON.stringify(claims)}\n활용 문헌(제목·초록 기반 카드, 원문 미분석):\n${JSON.stringify(docs)}\n${w.text?`\n현재 초안(이어서 다듬기):\n${w.text.slice(0,4000)}`:""}\n\n규칙: ${S.settings.lang}로 쓰고, 문헌을 근거로 쓸 때는 반드시 [@문헌id] 표시만 붙이세요(위 목록의 id만). 쪽수와 직접 인용문은 절대 쓰지 마세요. 카드에 없는 내용을 문헌이 말한 것처럼 쓰지 마세요. 근거가 없는 주장은 [검증 필요]를 붙이세요. 분량 약 ${Math.round((parseInt(S.settings.length)||dt().length)/Math.max(1,D.chapters.length))}자.\n반드시 JSON만 출력: {"text":"본문","relation_to_purpose":"이 장이 연구 목적·질문과 어떻게 연결되는지 2~3문장","offtrack":[{"sentence":"연구 방향에서 벗어날 수 있는 문장(본문 그대로)","reason":"이유"}]}`;
  const r=parseJSON(await callClaude(prompt,8000));if(!r.text)throw new Error("본문이 비어 있습니다.");
  const okIds=new Set(ch.doc_ids);let bad=0;const text=String(r.text).replace(CITE_RE,(m,id,pg)=>{if(!okIds.has(id)&&!litById(id)){bad++;return `[검증 필요: 확인되지 않은 문헌]`;}return m;});
  saveVersion(chId,"AI 작성 전");w.text=text;w.ai_note=r.relation_to_purpose||"";w.offtrack=(r.offtrack||[]).filter(o=>o&&o.sentence);w.ai_by=G.model;syncCitations(w);reviewChapter(chId);saveVersion(chId,"AI 초안");return bad;}
function skeletonChapter(chId){const ch=dsChapter(chId),w=S.writing[chId];const lines=[`## ${ch.title}`,""];
  let di=0;for(const p of String(ch.points||"").split("\n").filter(Boolean)){lines.push(`### ${p}`,`[작성 필요] 이 논점에 대한 연구자 서술`);let rel=ch.claim_ids.map(claimById).filter(Boolean).flatMap(c=>c.evidence).filter(e=>litById(e.doc_id)).slice(0,3).map(e=>({id:e.doc_id,gist:e.gist}));if(!rel.length){rel=ch.doc_ids.slice(di,di+2).filter(litById).map(id=>({id,gist:(cardOf(litById(id))||{}).claims}));di+=2;}rel.forEach(e=>lines.push(`- 근거 후보: ${litById(e.id).title.slice(0,50)} [@${e.id}]${e.gist&&e.gist!=="미확인"?` — 요지: ${e.gist}`:""}`));lines.push("");}
  if(!ch.points)ch.doc_ids.slice(0,5).forEach(id=>lines.push(`- 활용 문헌: ${litById(id)?litById(id).title.slice(0,50):id} [@${id}]`));
  saveVersion(chId,"뼈대 전");w.text=(w.text?w.text+"\n\n":"")+lines.join("\n");w.ai_note="API 키가 없어 본문 대신 장 논점·근거 후보로 뼈대를 만들었습니다. [작성 필요] 부분을 연구자가 직접 씁니다.";syncCitations(w);saveVersion(chId,"뼈대");}
function saveVersion(chId,label){const w=S.writing[chId];if(!w.text&&label!=="저장")return;const last=w.versions[0];if(last&&last.text===w.text)return;w.versions.unshift({t:now(),label,text:w.text,chars:w.text.length});w.versions=w.versions.slice(0,40);w.updated=now();}

    else if(b.type==="figure")L.push(`*${f.capFigure.replace("{n}",b.n).replace("{t}",b.caption||"")}* (그림 자리)`,"");
    else if(b.type==="ref")L.push(`- ${b.text}`);}
  if(model.notes.length)L.push("",...model.notes.map(n=>`[^${n.n}]: ${n.text}`));return L.join("\n")+"\n";}

BIND.export=()=>{const f=S.format,F=S.front;
  const readFmt=()=>{for(const k of ["paper","font","latin","numbering","citeMode","refStyle","capTablePos","pageNum"])f[k]=$("#f_"+k).value;for(const k of ["mt","mb","ml","mr","size","line","indent"])f[k]=parseFloat($("#f_"+k).value)||0;for(const k of ["refPattern","capTable","capFigure"])f[k]=$("#f_"+k).value;for(const k of ["toc","chapterBreak","headCenter"])f[k]=$("#f_"+k).checked;};
  const readFront=()=>{for(const k of ["title_en","author","affiliation","date","abstract_ko","keywords_ko","abstract_en","keywords_en","summary"]){const el=$("#fr_"+k);if(el)F[k]=el.value;}};
  const invalidate=()=>{EX.report=null;EX.ack=false;};
  $("#f_save").onclick=async()=>{readFmt();invalidate();await flush();toast("서식을 저장했습니다. 다시 검증하세요.");render();};
  $("#x_preset").onclick=async()=>{if(!confirm(`${S.settings.docType} 기본 서식으로 되돌릴까요?`))return;const t=f.template;S.format=Object.assign({},fmtPre(),{required:undefined,template:t});invalidate();await flush();render();};
  $("#fr_save").onclick=async()=>{readFront();invalidate();await flush();toast("표지·초록을 저장했습니다.");render();};
  $("#t_file").onchange=async e=>{const file=e.target.files[0];if(!file)return;
    if(/\.hwp$/i.test(file.name)){toast("HWP(구형 바이너리)는 지원하지 않습니다. 한글에서 HWPX로 저장해 올려 주세요.");logSync("export","서식 파일","warn",`${file.name}: HWP 미지원`);e.target.value="";return;}
    if(/\.hwpx$/i.test(file.name)){try{const buf=await file.arrayBuffer();const info=await analyzeHwpx(buf);await dbPut("data","hwpx:"+S.id,buf);f.hwpx={name:file.name,size:file.size,info,at:now()};invalidate();logSync("export","HWPX 서식","ok",`${file.name}: 구역 ${info.sections} · 스타일 ${info.styles}`);await flush();toast("HWPX 서식을 분석했습니다(시험 기능).");}catch(err){toast("HWPX 서식을 읽지 못했습니다: "+err.message);logSync("export","HWPX 서식","error",err.message);}render();return;}
    try{const buf=await file.arrayBuffer();const info=analyzeTemplate(await unzip(buf));await dbPut("data","tpl:"+S.id,buf);f.template={name:file.name,size:file.size,use:true,info,map:info.map,at:now()};if(info.numbered.length)f.numbering="none";invalidate();logSync("export","서식 파일","ok",`${file.name} 분석: 스타일 ${info.styleCount}개`);await flush();toast("서식 파일을 분석했습니다.");}catch(err){toast("서식 파일을 읽지 못했습니다: "+err.message);logSync("export","서식 파일","error",err.message);}render();};
  const tu=$("#t_use");if(tu)tu.onchange=async()=>{f.template.use=tu.checked;invalidate();await flush();render();};
  const tdl=$("#t_del");if(tdl)tdl.onclick=async()=>{await dbDel("data","tpl:"+S.id);f.template=null;invalidate();await flush();render();};
  $("#v_run").onclick=async()=>{readFmt();readFront();const m=buildDoc();EX.report=Object.assign(m,{at:now()});EX.ack=false;await flush();render();};
  const ack=$("#v_ack");if(ack)ack.onchange=()=>{EX.ack=ack.checked;render();};
  document.querySelectorAll("[data-out]").forEach(b=>b.onclick=async()=>{const kind=b.dataset.out,m=buildDoc(),name=safeName(S.design.fields.title.value||S.settings.topic);const errs=m.issues.filter(i=>i.level==="오류").length,warns=m.issues.filter(i=>i.level==="경고").length;
    try{if(kind==="docx"){const blob=await buildDocx(m);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name+".docx";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);}
      else if(kind==="pdf"){const wnd=window.open("","_blank");if(!wnd)throw new Error("팝업이 막혀 인쇄 창을 열지 못했습니다. 팝업을 허용하세요.");wnd.document.write(printHtml(m));wnd.document.close();setTimeout(()=>{try{wnd.focus();wnd.print();}catch(e){}},600);}
      else if(kind==="md")download(name+".md",markdownOut(m),"text/markdown");
      else download(name+".html",printHtml(m),"text/html");
      S.exportLog.unshift({t:now(),format:{docx:"DOCX",pdf:"PDF(인쇄)",md:"Markdown",html:"HTML"}[kind],name,errors:errs,warns,template:f.template&&f.template.use?f.template.name:""});S.exportLog=S.exportLog.slice(0,50);logSync("export","문서 출력","ok",`${kind.toUpperCase()} · 오류 ${errs} · 경고 ${warns}`);await flush();render();}
    catch(e){logSync("export","문서 출력","error",e.message);toast(e.message);}});
};

function systemStatus(){const s=S.settings,out=[];const add=(area,state,label,cause,view)=>out.push({area,state,label,cause,view});

async function analyzeHwpx(buf){const files=await unzip(buf);const mt=files["mimetype"]?td.decode(files["mimetype"]).trim():"";if(mt!=="application/hwp+zip")throw new Error("HWPX 파일이 아닙니다(mimetype 없음).");
  const secs=Object.keys(files).filter(n=>/^Contents\/section\d+\.xml$/.test(n));if(!secs.length)throw new Error("본문(section0.xml)이 없습니다.");const hd=files["Contents/header.xml"]?td.decode(files["Contents/header.xml"]):"";
  const styles=[...hd.matchAll(/<hh:style\b([^>]*)>/g)].map(m=>{const a=m[1],g=k=>(a.match(new RegExp(k+'="([^"]*)"'))||[])[1]||"";return {id:g("id"),name:g("name"),eng:g("engName"),para:g("paraPrIDRef"),char:g("charPrIDRef"),type:g("type")};});
  const find=(...ns)=>styles.find(s=>ns.some(n=>s.name===n||s.eng.toLowerCase()===n.toLowerCase()));
  return {sections:secs.length,styles:styles.length,body:find("바탕글","Normal")||styles[0]||null,h1:find("개요 1","Outline 1","제목 1"),h2:find("개요 2","Outline 2","제목 2")};}

/* ---------- 토픽·방향: 지정한 자료 전체 ---------- */
VIEWS.topics=()=>{const T=papers().filter(p=>p.in_topic&&p.decision!=="제외");const groups=new Map();T.forEach(p=>{const k=tpName(p)||"미지정";if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);});
  const names=[...groups.keys()];const allNames=[...new Set([...names,...papers().map(tpName).filter(Boolean)])];
  return hubHeader("topics","판단하기에서 지정한 토픽 자료가 모두 나옵니다. 토픽을 바꾸거나 빼서 마지막으로 다듬은 뒤 AI 집필을 시작하세요.")+
  (T.length?`<p class="tp-sum"><b>${T.length}</b>편 · 토픽 <b>${names.length}</b>개 <span class="hint">· 관련도 높음 ${T.filter(p=>BAND(p.relevance)==="높음").length} · 중간 ${T.filter(p=>BAND(p.relevance)==="중간").length} · 낮음 ${T.filter(p=>BAND(p.relevance)==="낮음").length}</span></p>
   <div class="tpgroups">${[...groups.entries()].sort((a,b)=>b[1].length-a[1].length).map(([name,list])=>`<section class="card tpg"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(name)} <span class="hint">${list.length}편</span></h3><button class="btn sm" data-tren="${esc(name)}">토픽 이름 바꾸기</button></div>
    <ul class="tplist">${list.sort((a,b)=>(b.relevance||0)-(a.relevance||0)).map(p=>`<li><span class="tpl-m">${gradeBadge(p.relevance)} ${bandChip(p.relevance)}<span><b data-topen="${p.id}">${esc(p.title)}</b><small>${esc(p.authors||"저자 미확인")} · ${esc(String(p.year||"연도 미확인"))}${p.journal?` · ${esc(p.journal)}`:""}</small></span></span>
     <span class="tpl-a"><label class="sr" for="ts_${p.id}">토픽</label><select id="ts_${p.id}" data-tsel="${p.id}">${allNames.map(n=>`<option ${n===tpName(p)?"selected":""}>${esc(n)}</option>`).join("")}<option value="__new">+ 새 토픽…</option></select><button class="btn sm" data-tout="${p.id}">빼기</button></span></li>`).join("")}</ul></section>`).join("")}</div>
   <section class="card tp-start"><div><h3 style="margin:0 0 4px">이 자료로 AI 집필 시작</h3><p class="hint" style="margin:0">지정한 ${T.length}편을 각 장의 근거 문헌으로 깔고, 참고문헌 후보(채택)로 넣은 뒤 AI 집필로 넘어갑니다. 목차는 연구 설정의 목차를 씁니다.</p></div><button class="btn primary big" id="tp_start">AI 집필 시작 →</button></section>`
  :`<section class="card"><p class="hint" style="margin:0">아직 토픽으로 지정한 자료가 없습니다. <b>판단하기</b>에서 AI 분류·승인 뒤 토픽을 지정하세요.</p><button class="btn primary" style="margin-top:12px" data-hub="manage">판단하기로 →</button></section>`);};
BIND.topics=()=>{document.querySelectorAll("[data-hub]").forEach(b=>b.onclick=()=>{if(b.dataset.hub!==current)go(b.dataset.hub);});const rerender=()=>{const y=window.scrollY;render();window.scrollTo(0,y);};
  document.querySelectorAll("[data-topen]").forEach(b=>b.onclick=()=>openItem(b.dataset.topen));
  document.querySelectorAll("[data-tsel]").forEach(s=>s.onchange=async()=>{const p=S.items.find(i=>i.id===s.dataset.tsel);let v=s.value;if(v==="__new"){v=(prompt("새 토픽 이름")||"").trim();if(!v){rerender();return;}}addToTopic(p,v);await flush();rerender();});
  document.querySelectorAll("[data-tout]").forEach(b=>b.onclick=async()=>{const p=S.items.find(i=>i.id===b.dataset.tout);p.in_topic=false;addHistory(p,"토픽 지정","지정","해제","연구자","토픽·방향에서 빼기");await flush();rerender();});
  document.querySelectorAll("[data-tren]").forEach(b=>b.onclick=async()=>{const old=b.dataset.tren,nv=(prompt(`"${old}" 토픽의 새 이름`,old)||"").trim();if(!nv||nv===old)return;papers().filter(p=>p.in_topic&&(tpName(p)||"미지정")===old).forEach(p=>{p.topic_final=nv;});await flush();rerender();});
  const st=$("#tp_start");if(st)st.onclick=async()=>{const T=papers().filter(p=>p.in_topic&&p.decision!=="제외").sort((a,b)=>(b.relevance||0)-(a.relevance||0));if(!T.length)return;
    ensure6();syncOutline();const ids=T.map(p=>p.id);S.design.chapters.forEach(c=>{c.doc_ids=ids.slice();});T.forEach(p=>setDecision(p,"채택",true));
    if(S.settings.view)setField("view",S.settings.view,"연구자");S.design.confirmed_at=S.design.confirmed_at||now();logSync("design","AI 집필 시작","ok",`토픽 자료 ${ids.length}편`);await flush();toast(`토픽 자료 ${ids.length}편으로 AI 집필을 시작합니다.`);WST="prep";go("write");};};
TOUR.forEach(t=>{if(t.sel===".tlist"){t.sel=".tpgroups";t.t="토픽·방향";t.d="판단하기에서 지정한 토픽 자료가 토픽별로 모두 나옵니다. 토픽을 바꾸거나 빼서 다듬으세요.";}if(t.sel==="#tp_go"){t.sel="#tp_start";t.t="AI 집필 시작";t.d="지정한 자료를 근거 문헌과 참고문헌 후보로 깔고 AI 집필로 넘어갑니다.";}if(t.v==="manage"){t.sel=".mg-grid";t.d="AI 분류하기 → AI 승인하기 → 내 검토(승인 해제·토픽 지정) 순서로 진행합니다. 아래 목록은 정렬과 검색으로 볼 수 있습니다.";delete t.act;}});

/* ---------- 시작 ---------- */
(async()=>{
  $("#view").innerHTML=`<p class="hint">불러오는 중…</p>`;
  try{
    G=Object.assign(G,await dbGet("data","global")||{});INDEX=await dbGet("data","index")||[];
    let migrated=null;
    if(!INDEX.length){let raw=null,done=null;try{raw=localStorage.getItem(LEGACY_KEY);done=localStorage.getItem(LEGACY_KEY+"_migrated");}catch(e){}
      if(raw&&!done){try{migrated=await migrateLegacy(raw);}catch(e){toast("기존 자료를 옮기지 못했습니다: "+e.message);}}}
    current="home";render();
    if(migrated)toast(`기존 자료를 ${migrated} 프로젝트로 옮겼습니다. 원래 데이터는 브라우저에 그대로 보관돼 있습니다.`);
  }catch(e){
    $("#view").innerHTML=`<h1>저장소를 열 수 없습니다</h1><div class="notice">${esc(e.message)}</div><p>이 브라우저에서 IndexedDB를 사용할 수 없습니다. Chrome의 시크릿 창이 아닌 일반 창에서 열고, 같은 앱이 열린 다른 탭이 있으면 닫은 뒤 새로고침하세요.</p>`;
  }
})();
</script>
</body>
</html>
